<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遍路みちしるべ ― 徒歩×公共交通 周遊プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
<script>
  // Google Mapsのスクリプトはasync読み込みのため、下部の本体スクリプトが
  // 実行される前にコールバックが呼ばれることがある。そのため、この受け皿だけは
  // ページの一番早い段階（headの中）で先に定義しておく。
  window.__googleMapsReady = false;
  window.__googleMapsReadyWaiters = [];
  function __initGoogleMaps(){
    window.__googleMapsReady = true;
    window.__googleMapsReadyWaiters.forEach(function(fn){ fn(); });
    window.__googleMapsReadyWaiters = [];
  }

  // Google Maps自体の表示言語(地名・コントロール等)は読み込み時のパラメータでしか
  // 指定できないため、保存済みの言語設定をここで読み取ってスクリプトタグを動的に生成する。
  (function(){
    var savedLang = localStorage.getItem('ohenro_lang') || 'ja';
    var mapsScript = document.createElement('script');
    mapsScript.async = true;
    mapsScript.src = 'https://maps.googleapis.com/maps/api/js?key={{GOOGLE_MAPS_API_KEY}}&language=' + savedLang + '&region=JP&loading=async&callback=__initGoogleMaps';
    document.head.appendChild(mapsScript);
  })();
</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="hero-top-row">
      <div class="hero-eyebrow">Ohenro Route Planner</div>
    </div>
    <div class="hero-title-row">
      <h1 data-i18n="hero_title"></h1>
      <button class="info-btn" onclick="toggleHeroInfo()" aria-label="info">i</button>
    </div>
    <div class="info-tooltip" id="heroInfoTooltip" data-i18n="hero_desc"></div>
  </div>
</div>

<div class="view" id="viewHome">
<div class="wrap">
  <div class="panel">
    <div class="controls">
      <div>
        <label data-i18n="label_start"></label>
        <select id="startTemple"></select>
        <button type="button" class="locate-btn" onclick="setStartFromLocation()" data-i18n="btn_locate"></button>
      </div>
      <div>
        <label data-i18n="label_end"></label>
        <select id="endTemple"></select>
      </div>
      <div>
        <label data-i18n="label_date"></label>
        <div class="date-fields" id="dateFields"></div>
      </div>
      <div>
        <label data-i18n="label_time"></label>
        <div class="time-fields" id="timeFields"></div>
      </div>
      <div class="field-full">
        <label data-i18n="label_mode"></label>
        <div class="mode-toggle">
          <button id="modeEfficient" class="active" data-i18n="mode_efficient"></button>
          <button id="modeWalk" data-i18n="mode_walk"></button>
        </div>
      </div>
      <button class="run-btn" onclick="runPlanner()" data-i18n="btn_run"></button>
      <button class="share-btn" onclick="sharePlan()" data-i18n="btn_share"></button>
    </div>

    <div class="legend">
      <span><span class="swatch walk"></span><span data-i18n="legend_walk"></span></span>
      <span><span class="swatch bus"></span><span data-i18n="legend_bus"></span></span>
      <span class="mono" style="color:#8a8578;" data-i18n="legend_nokyo"></span>
    </div>

    <div id="summary"></div>
    <div class="timeline" id="timeline"></div>

    <div class="footnote" data-i18n="footnote"></div>
    <div class="footnote">
      <a href="/privacy" target="_blank" rel="noopener" style="color:#8a8578;">Privacy Policy</a>
      　|　
      <a href="/credits" target="_blank" rel="noopener" style="color:#8a8578;">Credits / データ提供元</a>
    </div>
  </div>
</div>
</div>

<div class="view" id="viewZukan" style="display:none;">
  <div class="view-header">
    <h2 data-i18n="zukan_title"></h2>
    <div class="sub" id="zukanProgress"></div>
  </div>
  <div class="zukan-grid" id="zukanGrid"></div>
</div>

<div class="view" id="viewSettings" style="display:none;">
  <div class="view-header"><h2 data-i18n="settings_title"></h2></div>
  <div class="settings-body">
    <div class="settings-section-title" data-i18n="settings_language_section"></div>
    <select class="settings-select" onchange="setLanguage(this.value); this.blur()" id="langSelect">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
    </select>

    <div class="settings-divider"></div>

    <div class="settings-section-title" data-i18n="settings_location_section"></div>
    <div class="settings-section-desc" data-i18n="settings_location_desc"></div>
    <div class="settings-toggle-row">
      <span id="settingsLocationStatus"></span>
      <label class="toggle-switch">
        <input type="checkbox" id="locationToggle" onchange="onLocationToggleChange(this)">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <button type="button" class="settings-secondary-btn" onclick="settingsOpenAppSettings()" data-i18n="settings_location_opensettings_btn"></button>

    <div class="settings-divider"></div>
    <div class="settings-section-title" data-i18n="settings_theme_section"></div>
    <select class="settings-select" onchange="setTheme(this.value); this.blur()" id="themeSelect">
      <option value="auto" data-i18n="theme_auto"></option>
      <option value="light" data-i18n="theme_light"></option>
      <option value="dark" data-i18n="theme_dark"></option>
    </select>
  </div>
</div>

<div class="bottom-tab-bar">
  <button type="button" class="tab-btn active" id="tabHomeBtn" onclick="switchTab('home')">
    <span class="tab-icon">🏠</span><span class="tab-label" data-i18n="tab_home"></span>
  </button>
  <button type="button" class="tab-btn" id="tabZukanBtn" onclick="switchTab('zukan')">
    <span class="tab-icon">📖</span><span class="tab-label" data-i18n="tab_zukan"></span>
  </button>
  <button type="button" class="tab-btn" id="tabSettingsBtn" onclick="switchTab('settings')">
    <span class="tab-icon">⚙️</span><span class="tab-label" data-i18n="tab_settings"></span>
  </button>
</div>

<div class="map-overlay" id="goshuinOverlay">
  <div class="map-modal goshuin-modal">
    <div class="map-modal-head">
      <div><h3 id="goshuinTempleName" data-i18n="goshuin_title"></h3><div class="sub" id="goshuinVisitedOn"></div></div>
      <button class="map-close" onclick="closeGoshuin()">&times;</button>
    </div>
    <div class="goshuin-viewer">
      <div class="goshuin-frame" id="goshuinFrame">
        <img class="goshuin-img" id="goshuinImg" src="" alt="">
        <div class="goshuin-date-overlay" id="goshuinDateOverlay"></div>
      </div>
      <div class="goshuin-placeholder" id="goshuinPlaceholder"></div>
    </div>
    <div class="goshuin-action-wrap">
      <button type="button" class="goshuin-visit-btn" id="goshuinVisitBtn" onclick="toggleVisitedFromDetail()"></button>
    </div>
  </div>
</div>

<div class="map-overlay" id="mapOverlay">
  <div class="map-modal">
    <div class="map-modal-head">
      <div>
        <h3 id="mapTitle"></h3>
        <div class="sub" id="mapSub"></div>
      </div>
      <button class="map-close" onclick="closeMap()">&times;</button>
    </div>
    <div class="map-canvas-wrap">
      <div id="mapCanvas"></div>
      <div class="map-fab-group">
        <button type="button" class="map-fab" id="mapCompassBtn" onclick="toggleMapHeadingMode()" title="向いている方向を上にする" aria-label="向いている方向を上にする"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25" fill="#fff" stroke="#dadce0"/><path d="M12 4.5 15.2 12 12 10.8 8.8 12Z" fill="#ea4335"/><path d="m12 19.5-3.2-7.5 3.2 1.2 3.2-1.2Z" fill="#5f6368"/></svg></button>
        <button type="button" class="map-fab" id="mapLocateBtn" onclick="mapLocateMe()" title="現在地を表示" aria-label="現在地を表示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.25" fill="currentColor"/></svg></button>
      </div>
    </div>
    <div class="map-modal-foot" id="mapFoot"></div>
  </div>
</div>

<script>
  // サーバー側の環境変数(DISABLE_GOSHUIN_LOCATION_CHECK)を安全な真偽値だけ埋め込む。
  // テンプレートが未置換のまま(サーバーを経由せず直接開かれた場合)は
  // '{{DISABLE_GOSHUIN_LOCATION_CHECK}}' === 'true' が false になり、位置判定は有効側になる。
  window.OHENRO_CONFIG = Object.freeze({
    disableGoshuinLocationCheck: '{{DISABLE_GOSHUIN_LOCATION_CHECK}}' === 'true'
  });
</script>
<script src="/js/i18n.js"></script>
<script src="/js/geo-utils.js"></script>
<script src="/js/date-utils.js"></script>
<script src="/js/nokyo-utils.js"></script>
<script src="/js/constants.js"></script>
<script src="/js/app-core.js"></script>
<script src="/js/goshuin.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/route-planner.js"></script>
<script src="/js/app.js"></script>
<script src="/js/map.js"></script>
</body>
</html>

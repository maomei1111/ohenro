<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遍路みちしるべ ― 徒歩×公共交通 周遊プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
  // Google Mapsのスクリプトはasync読み込みのため、下部の本体スクリプトが
  // 実行される前にコールバックが呼ばれることがある。そのため、この受け皿だけは
  // ページの一番早い段階（headの中）で先に定義しておく。
  window.__googleMapsReady = false;
  window.__googleMapsReadyWaiters = [];
  function __initGoogleMaps(){
    window.__googleMapsReady = true;
    window.__googleMapsReadyWaiters.forEach(function(fn){ fn(); });
    window.__googleMapsReadyWaiters = [];
  }
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key={{GOOGLE_MAPS_API_KEY}}&language=ja&region=JP&loading=async&callback=__initGoogleMaps"></script>
<style>
  :root{
    --indigo-deep:#1D2B4F;
    --indigo-mid:#33507A;
    --washi:#EFE6D6;
    --washi-panel:#F7F1E6;
    --sumi:#2B2825;
    --vermillion:#A63A2A;
    --gold:#AD8A50;
    --line-walk:#5B6B4F;
    --line-bus:#A63A2A;
    --warn-bg:#F4E2DA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--washi);
    color:var(--sumi);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .hero{
    background:
      radial-gradient(circle at 85% -10%, rgba(255,255,255,0.06), transparent 55%),
      var(--indigo-deep);
    color:var(--washi);
    padding:48px 24px 40px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-40px; bottom:-60px;
    width:260px; height:260px;
    border:1px solid rgba(239,230,214,0.15);
    border-radius:50%;
  }
  .hero-top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .hero-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:0;
  }
  .lang-switch{
    display:flex;
    border:1px solid rgba(239,230,214,0.35);
    border-radius:2px;
    overflow:hidden;
  }
  .lang-btn{
    border:none;
    background:transparent;
    color:rgba(239,230,214,0.7);
    font-size:11px;
    font-family:'Noto Sans JP', sans-serif;
    padding:5px 12px;
    cursor:pointer;
  }
  .lang-btn.active{
    background:var(--gold);
    color:var(--indigo-deep);
    font-weight:700;
  }
  .hero h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:clamp(28px, 4vw, 40px);
    margin:0 0 12px;
    line-height:1.3;
  }
  .hero p{
    max-width:640px;
    font-size:15px;
    line-height:1.9;
    color:rgba(239,230,214,0.82);
    margin:0;
  }

  .wrap{ max-width:920px; margin:0 auto; padding:0 24px; }

  .panel{
    background:var(--washi-panel);
    border:1px solid rgba(43,40,37,0.1);
    border-radius:4px;
    padding:28px;
    margin-top:-28px;
    position:relative;
    z-index:2;
    box-shadow:0 12px 30px rgba(29,43,79,0.08);
  }

  .controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:16px;
    align-items:end;
  }
  @media (max-width:720px){ .controls{ grid-template-columns:1fr 1fr; } }

  label{
    display:block;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--indigo-mid);
    margin-bottom:6px;
    font-weight:700;
  }
  select, input[type=time]{
    width:100%;
    padding:10px 12px;
    border:1px solid rgba(43,40,37,0.25);
    border-radius:2px;
    background:#fff;
    font-family:'Noto Sans JP', sans-serif;
    font-size:14px;
    color:var(--sumi);
  }
  .mode-toggle{
    display:flex;
    border:1px solid var(--indigo-mid);
    border-radius:2px;
    overflow:hidden;
    height:41px;
  }
  .mode-toggle button{
    flex:1;
    border:none;
    background:#fff;
    color:var(--indigo-mid);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .mode-toggle button.active{
    background:var(--indigo-mid);
    color:#fff;
  }

  .run-btn{
    grid-column:1/-1;
    margin-top:4px;
    background:var(--vermillion);
    color:#fff;
    border:none;
    padding:13px 20px;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.03em;
    border-radius:2px;
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .run-btn:hover{ filter:brightness(1.08); }

  .legend{
    display:flex;
    gap:22px;
    margin:26px 0 6px;
    font-size:12.5px;
    color:var(--indigo-mid);
    flex-wrap:wrap;
  }
  .legend span{ display:flex; align-items:center; gap:7px; }
  .swatch{ width:20px; height:3px; display:inline-block; }
  .swatch.walk{ background:var(--line-walk); }
  .swatch.bus{ background:none; border-top:2px dashed var(--line-bus); height:0; width:20px; }

  .timeline{ margin:18px 0 40px; position:relative; }
  .stop{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:18px;
    position:relative;
  }
  .stop-rail{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .stop-dot{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--indigo-deep);
    border:3px solid var(--washi-panel);
    outline:1px solid rgba(43,40,37,0.2);
    z-index:2;
    margin-top:6px;
  }
  .stop-connector{
    flex:1;
    width:0;
    border-left:2px solid var(--line-walk);
    margin:2px 0;
  }
  .stop-connector.bus{
    border-left:2px dashed var(--line-bus);
  }
  .stop-time{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--indigo-mid);
    margin-top:4px;
  }

  .stop-card{
    padding:14px 0 26px;
  }
  .stop-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:17px;
    margin:2px 0 4px;
  }
  .stop-title .no{
    color:var(--vermillion);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    margin-right:8px;
  }
  .stop-meta{ font-size:12.5px; color:#5a564f; margin-bottom:8px; }
  .nokyo-badge{
    display:inline-block;
    font-size:11px;
    padding:3px 8px;
    border-radius:2px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .nokyo-ok{ background:#E4EBDD; color:#3E5A2C; }
  .nokyo-warn{ background:var(--warn-bg); color:var(--vermillion); }

  .segment-note{
    margin-top:8px;
    font-size:13px;
    background:#fff;
    border:1px solid rgba(43,40,37,0.1);
    border-radius:2px;
    padding:12px 14px;
    line-height:1.7;
    cursor:pointer;
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  .segment-note:hover{
    border-color:var(--indigo-mid);
    box-shadow:0 3px 10px rgba(29,43,79,0.1);
  }
  .segment-note .map-link{
    margin-top:8px;
    font-size:11px;
    color:var(--indigo-mid);
    font-family:'JetBrains Mono', monospace;
    text-align:right;
  }
  .segment-note b{ color:var(--indigo-deep); }
  .badge-mode{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    padding:2px 6px;
    border-radius:2px;
    margin-right:6px;
    font-weight:700;
  }
  .badge-mode.walk{ background:#E7EBE0; color:var(--line-walk); }
  .badge-mode.bus{ background:#F4E2DA; color:var(--line-bus); }
  .badge-mode.transfer{ background:#EFE3C8; color:var(--gold); margin-left:4px; }

  .summary{
    background:var(--indigo-deep);
    color:var(--washi);
    border-radius:4px;
    padding:22px 24px;
    margin-bottom:44px;
    display:flex;
    gap:32px;
    flex-wrap:wrap;
  }
  .summary .figure{ min-width:120px; }
  .summary .figure .num{
    font-family:'JetBrains Mono', monospace;
    font-size:26px;
    font-weight:700;
    color:#fff;
  }
  .summary .figure .lbl{
    font-size:11px;
    letter-spacing:0.06em;
    color:rgba(239,230,214,0.7);
    text-transform:uppercase;
    margin-top:2px;
  }

  .footnote{
    font-size:12px;
    color:#8a8578;
    line-height:1.8;
    padding-bottom:40px;
  }

  .map-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(29,43,79,0.55);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .map-overlay.open{ display:flex; }
  .map-modal{
    background:var(--washi-panel);
    border-radius:4px;
    width:100%;
    max-width:640px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .map-modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    background:var(--indigo-deep);
    color:var(--washi);
  }
  .map-modal-head h3{
    font-family:'Noto Serif JP', serif;
    font-size:16px;
    margin:0;
    font-weight:700;
  }
  .map-modal-head .sub{
    font-size:11px;
    color:rgba(239,230,214,0.7);
    font-family:'JetBrains Mono', monospace;
    margin-top:2px;
  }
  .map-close{
    background:none;
    border:1px solid rgba(239,230,214,0.4);
    color:var(--washi);
    width:28px; height:28px;
    border-radius:50%;
    cursor:pointer;
    font-size:15px;
    line-height:1;
  }
  #mapCanvas{ width:100%; height:360px; }
  .map-modal-foot{
    padding:12px 18px 16px;
    font-size:12px;
    color:#5a564f;
    line-height:1.7;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="hero-top-row">
      <div class="hero-eyebrow">Ohenro Route Planner</div>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ja" onclick="setLanguage('ja')">日本語</button>
        <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
      </div>
    </div>
    <h1 data-i18n="hero_title"></h1>
    <p data-i18n="hero_desc"></p>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="controls">
      <div>
        <label data-i18n="label_start"></label>
        <select id="startTemple"></select>
      </div>
      <div>
        <label data-i18n="label_end"></label>
        <select id="endTemple"></select>
      </div>
      <div>
        <label data-i18n="label_time"></label>
        <input type="time" id="startTime" value="07:30">
      </div>
      <div>
        <label data-i18n="label_mode"></label>
        <div class="mode-toggle">
          <button id="modeEfficient" class="active" data-i18n="mode_efficient"></button>
          <button id="modeWalk" data-i18n="mode_walk"></button>
        </div>
      </div>
      <button class="run-btn" onclick="runPlanner()" data-i18n="btn_run"></button>
    </div>

    <div class="legend">
      <span><span class="swatch walk"></span><span data-i18n="legend_walk"></span></span>
      <span><span class="swatch bus"></span><span data-i18n="legend_bus"></span></span>
      <span class="mono" style="color:#8a8578;" data-i18n="legend_nokyo"></span>
    </div>

    <div id="summary"></div>
    <div class="timeline" id="timeline"></div>

    <div class="footnote" data-i18n="footnote"></div>
  </div>
</div>

<div class="map-overlay" id="mapOverlay">
  <div class="map-modal">
    <div class="map-modal-head">
      <div>
        <h3 id="mapTitle"></h3>
        <div class="sub" id="mapSub"></div>
      </div>
      <button class="map-close" onclick="closeMap()">&times;</button>
    </div>
    <div id="mapCanvas"></div>
    <div class="map-modal-foot" id="mapFoot"></div>
  </div>
</div>

<script>
// ==================================================================
// ---- 多言語対応（i18n） ----
// ==================================================================
let currentLang = localStorage.getItem('ohenro_lang') || 'ja';

const I18N = {
  ja: {
    hero_title: '遍路みちしるべ<br>徒歩と公共交通、区間ごとに最適な移動手段を。',
    hero_desc: '四国八十八ヶ所すべてを対象にした周遊プランナーです。区間距離とバスダイヤをもとに、納経所が開いている時間内に次の札所へ着けるかを計算し、徒歩とバスのどちらが良いか区間ごとに提案します。順打ち（1→88番）・逆打ち（88→1番）のどちらにも対応しています。徒歩時間は、事前計算済みの区間は実際の道のり、未計算の区間は直線距離からの概算です。※現在バスの実データが整備済みなのは徳島・高知・香川の一部エリアのみです。それ以外の区間は「バス便が見つかりません」と表示され、徒歩での計算になります。',
    label_start: '出発する札所',
    label_end: '到着したい札所',
    label_time: '出発時刻',
    label_mode: '優先モード',
    mode_efficient: '効率優先',
    mode_walk: '徒歩優先',
    btn_run: 'ルートを計算する',
    legend_walk: '徒歩区間',
    legend_bus: 'バス区間',
    legend_nokyo: '納経所 標準受付 7:00–17:00 として計算',
    footnote: '※ バス時刻は各バス会社の公開データに基づいています。徒歩時間は実際の道のりをもとに概算しています。祝日はダイヤが異なる場合があります。',
    map_title: '区間の地図',
    summary_arrival: '最終到着予想',
    summary_walk_total: '徒歩合計距離',
    summary_bus_segments: '区間',
    summary_bus_label: 'バス利用区間',
    summary_nokyo_label: '最終札所の納経所',
    summary_ok: 'OK',
    summary_warn: '要注意',
    nokyo_ok: '納経受付時間内',
    nokyo_warn: '納経受付終了後の可能性',
    err_same_temple: '出発と到着が同じ札所です。異なる札所を選んでください。',
    loading_route: 'ルートを取得中…',
    loading_temples: '札所データを読み込み中…',
    err_temples: '札所データの取得に失敗しました。しばらくしてから、もう一度お試しください。',
    walk_mode_note: '徒歩優先モード',
    bus_no_service: 'この時間以降、実データ上でバス便が見つかりません → 徒歩',
    bus_fetch_error: 'バス情報の取得に失敗しました（通信エラー） → 徒歩で計算',
    walk_faster: (dep)=>`バス(${dep}発)より徒歩の方が早いため徒歩を推奨`,
    bus_direct: (agency,dep,arr)=>`${agency}｜${dep}発 → ${arr}着`,
    bus_transfer: (agency,dep,mid,midArr,midDep,arr)=>`${agency}｜${dep}発 → 「${mid}」で乗り換え(${midArr}着/${midDep}発) → ${arr}着`,
    to_temple_km: (name,km)=>`${name}まで ${km}km`,
    transfer_badge: '乗り換え1回',
    map_link: '地図を見る →',
    route_shown_direct: '実際の道のりを表示しています',
    route_shown_bus: '徒歩→バス→徒歩のルートを表示しています',
    route_fail: (err)=>`ルート取得に失敗 → 直線で仮表示中｜エラー: ${err}`,
    landmarks_found: (n,list)=>`沿道の目印 ${n}件：${list}`,
    landmarks_none: '沿道180m以内に名称付きの目印は見つかりませんでした',
    landmarks_fail: (err)=>`目印データの取得に失敗｜エラー: ${err}`,
    elevation_stats: (gain,loss)=>`徒歩区間の高低差：⬆️獲得標高 ${gain}m／⬇️下り ${loss}m`,
    elevation_climb: (s,e,len,gain)=>`最大の上り：${s}km地点から${e}km地点まで（${len}km区間）で${gain}m上ります。`,
    current_location: '現在地',
    landmark_toilet: 'トイレ', landmark_lodging: '宿泊', landmark_roadside: '道の駅',
    landmark_onsen: '温泉', landmark_vending: '自販機', landmark_temple: '寺社',
    landmark_shop: '商店', landmark_dining: '飲食', landmark_station: '駅',
    landmark_busstop: 'バス停', landmark_historic: '史跡', landmark_tourism: '観光', landmark_other: '目印',
  },
  en: {
    hero_title: 'Ohenro Route Guide<br>The best way to travel each leg, on foot or by bus.',
    hero_desc: 'A route planner covering all 88 temples of the Shikoku Pilgrimage. Using segment distances and bus timetables, it works out whether you can reach the next temple while its stamp office is still open, and suggests the better option for each leg — walking or bus. Both the standard order (1→88) and reverse order (88→1) are supported. Walking times use real route data where available, and straight-line estimates elsewhere. Note: real bus data currently only covers parts of Tokushima, Kochi, and Kagawa. Other legs will show "no bus service found" and default to walking.',
    label_start: 'Starting temple',
    label_end: 'Destination temple',
    label_time: 'Departure time',
    label_mode: 'Priority mode',
    mode_efficient: 'Fastest',
    mode_walk: 'Walk only',
    btn_run: 'Calculate route',
    legend_walk: 'Walking leg',
    legend_bus: 'Bus leg',
    legend_nokyo: 'Assumes stamp office hours of 7:00–17:00',
    footnote: '※ Bus times are based on each operator\'s published data. Walking times are estimated from actual routes. Holiday schedules may differ.',
    map_title: 'Segment map',
    summary_arrival: 'Estimated arrival',
    summary_walk_total: 'Total walking distance',
    summary_bus_segments: 'segment(s)',
    summary_bus_label: 'Bus legs used',
    summary_nokyo_label: 'Stamp office at final temple',
    summary_ok: 'OK',
    summary_warn: 'Check timing',
    nokyo_ok: 'Within stamp office hours',
    nokyo_warn: 'May be after stamp office closes',
    err_same_temple: 'Start and destination are the same temple. Please choose two different temples.',
    loading_route: 'Fetching route…',
    loading_temples: 'Loading temple data…',
    err_temples: 'Failed to load temple data. Please try again in a moment.',
    walk_mode_note: 'Walk-only mode',
    bus_no_service: 'No bus service found in the data after this time → walking',
    bus_fetch_error: 'Failed to fetch bus data (connection error) → calculated on foot',
    walk_faster: (dep)=>`Walking is faster than the bus (departs ${dep}) — walking recommended`,
    bus_direct: (agency,dep,arr)=>`${agency} | departs ${dep} → arrives ${arr}`,
    bus_transfer: (agency,dep,mid,midArr,midDep,arr)=>`${agency} | departs ${dep} → transfer at "${mid}" (arr ${midArr} / dep ${midDep}) → arrives ${arr}`,
    to_temple_km: (name,km)=>`To ${name}: ${km}km`,
    transfer_badge: '1 transfer',
    map_link: 'View map →',
    route_shown_direct: 'Showing the actual walking/driving route',
    route_shown_bus: 'Showing walk → bus → walk route',
    route_fail: (err)=>`Route lookup failed → showing a straight line instead | error: ${err}`,
    landmarks_found: (n,list)=>`${n} nearby point(s) of interest: ${list}`,
    landmarks_none: 'No named points of interest found within 180m of the route',
    landmarks_fail: (err)=>`Failed to load nearby points of interest | error: ${err}`,
    elevation_stats: (gain,loss)=>`Elevation change on foot: ⬆️ ${gain}m climb / ⬇️ ${loss}m descent`,
    elevation_climb: (s,e,len,gain)=>`Biggest climb: ${gain}m over ${len}km, from the ${s}km point to the ${e}km point.`,
    current_location: 'Your location',
    landmark_toilet: 'Restroom', landmark_lodging: 'Lodging', landmark_roadside: 'Roadside station',
    landmark_onsen: 'Hot spring', landmark_vending: 'Vending machine', landmark_temple: 'Temple/Shrine',
    landmark_shop: 'Shop', landmark_dining: 'Food', landmark_station: 'Station',
    landmark_busstop: 'Bus stop', landmark_historic: 'Historic site', landmark_tourism: 'Sightseeing', landmark_other: 'Landmark',
  },
};

function t(key, ...args){
  const entry = I18N[currentLang][key] ?? I18N.ja[key];
  return typeof entry === 'function' ? entry(...args) : entry;
}

// 88札所の英語表記（標準的なヘボン式ローマ字表記に基づく）
const TEMPLE_NAMES_EN = {
  1:'Ryozenji', 2:'Gokurakuji', 3:'Konsenji', 4:'Dainichiji', 5:'Jizoji', 6:'Anrakuji',

const API_BASE = ''; // 同一オリジンから配信するため空文字（相対パス）でOK
let temples = [];

const startSel = document.getElementById('startTemple');
const endSel = document.getElementById('endTemple');

function metersBetween(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function distToPolyline(lat, lng, coords){
  let min = Infinity;
  for(const [clat, clng] of coords){
    const d = metersBetween(lat, lng, clat, clng);
    if(d < min) min = d;
  }
  return min;
}

async function loadTemples(){
  const res = await fetch(`${API_BASE}/temples`);
  if(!res.ok) throw new Error(`temples API responded ${res.status}`);
  const raw = await res.json();
  raw.sort((a,b)=>a.no-b.no);
  temples = raw.map((t, i) => {
    const prev = raw[i-1];
    // 実測値(Google Directionsで事前計算済み)があればそれを使い、無ければ直線距離で概算
    const hasReal = t.walkDistanceKm != null && t.walkDurationMin != null;
    const straightKm = prev ? metersBetween(prev.lat, prev.lng, t.lat, t.lng)/1000 : 0;
    return {
      no: t.no, name: t.name, kana: '',
      distanceKm: hasReal ? t.walkDistanceKm : Math.round(straightKm*10)/10,
      walkDurationMin: hasReal ? t.walkDurationMin : null, // nullなら時速4km換算にフォールバック
      isRealWalkData: hasReal,
      lat: t.lat, lng: t.lng,
    };
  });
}

// 区間の徒歩時間(分)を返す。実測値があればそれを、無ければ距離÷時速4kmで概算する。
function walkMinutesFor(temple){
  if(temple.isRealWalkData && temple.walkDurationMin != null) return temple.walkDurationMin;
  return temple.distanceKm / 4 * 60;
}

function populateTempleSelects(){

function toMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function toHHMM(mins){
  mins = Math.round(mins);
  const h = Math.floor(mins/60)%24;
  const m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

async function fetchNextBus(fromNo, toNo, timeStr, weekday){
  try{
    const url = `${API_BASE}/next-bus?from=${fromNo}&to=${toNo}&time=${encodeURIComponent(timeStr)}&weekday=${weekday}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`API responded ${res.status}`);
    const data = await res.json();
    return data.result;
  }catch(e){
    console.warn('next-bus API fetch failed', e);
    return undefined;
  }
}

async function runPlanner(){
  const startNo = Number(startSel.value);
  const endNo = Number(endSel.value);
  const startTimeStr = document.getElementById('startTime').value || '07:30';

  if(startNo === endNo){
    document.getElementById('timeline').innerHTML =
      `<div class="segment-note">${t('err_same_temple')}</div>`;
    document.getElementById('summary').innerHTML = '';
    return;
  }

  document.getElementById('timeline').innerHTML = `<div class="segment-note">${t('loading_route')}</div>`;
  document.getElementById('summary').innerHTML = '';

  // 順打ち(番号が小さい→大きい)・逆打ち(大きい→小さい)の両方に対応
  const isReverse = startNo > endNo;
  const lo = Math.min(startNo, endNo), hi = Math.max(startNo, endNo);
  const inRange = temples.filter(t=>t.no>=lo && t.no<=hi).sort((a,b)=>a.no-b.no);
  const route = isReverse ? [...inRange].reverse() : inRange;

  // 隣接する2札所間の区間距離(distanceKm)は、番号が大きい方の札所に保持されている
  // (loadTemples()で「1つ前の札所からの距離」として格納しているため)。
  // 順打ち・逆打ちどちらでも、区間の両端のうち番号が大きい方を見れば同じ値が取れる。
  function segmentInfo(templeA, templeB){
    const higher = temples.find(t=>t.no===Math.max(templeA.no, templeB.no));
    return { distanceKm: higher.distanceKm, walkMin: walkMinutesFor(higher) };
  }

  let currentMin = toMinutes(startTimeStr);
  let totalWalkKm = 0, busSegments = 0, walkSegments = 0;
  const NOKYO_CLOSE = toMinutes('17:00');
  const weekday = new Date().getDay();

  const arrival = [{ no:route[0].no, timeMin: currentMin, mode:null, note:null }];

  for(let i=1;i<route.length;i++){
    const seg = route[i];
    const prevNo = route[i-1].no;
    const { distanceKm, walkMin } = segmentInfo(route[i-1], seg);
    let chosen, arriveMin, note, missedBus=false, busResult=null;

    const walkArrive = currentMin + walkMin;

    if(mode==='efficient'){
      // バス停までの徒歩時間は、停留所ごとの実距離をもとにサーバー側で正確に計算するため、
      // ここでは現在時刻をそのまま渡すだけでよい。
      busResult = await fetchNextBus(prevNo, seg.no, toHHMM(currentMin), weekday);

      if(busResult === undefined){
        chosen = 'walk';
        arriveMin = walkArrive;
        note = t('bus_fetch_error');
      } else if(busResult){
        const busArrive = busResult.arrivalMin;
        if(busArrive < walkArrive){
          chosen = 'bus';
          arriveMin = busArrive;
          note = busResult.transfers === 1
            ? t('bus_transfer', agencyDisplayName(busResult.agency_key), hhmm(busResult.from_departure), busResult.mid_stop_name, hhmm(busResult.mid_arrival), hhmm(busResult.mid_departure), hhmm(busResult.to_arrival))
            : t('bus_direct', agencyDisplayName(busResult.agency_key), hhmm(busResult.from_departure), hhmm(busResult.to_arrival));
        } else {
          chosen = 'walk';
          arriveMin = walkArrive;
          note = t('walk_faster', hhmm(busResult.from_departure));
        }
      } else {
        chosen = 'walk';
        arriveMin = walkArrive;
        note = t('bus_no_service');
        missedBus = true;
      }
    } else {
      chosen = 'walk';
      arriveMin = walkArrive;
      note = t('walk_mode_note');
    }

    if(chosen==='bus') busSegments++; else { walkSegments++; totalWalkKm += distanceKm; }

    currentMin = arriveMin;
    arrival.push({ no:seg.no, timeMin:currentMin, mode:chosen, note, distanceKm, missedBus, busResult: chosen==='bus' ? busResult : null });
  }

  lastArrival = arrival;

  const finalMin = arrival[arrival.length-1].timeMin;
  const overClose = finalMin > NOKYO_CLOSE;
  document.getElementById('summary').innerHTML = `
    <div class="summary">
      <div class="figure"><div class="num">${toHHMM(finalMin)}</div><div class="lbl">${t('summary_arrival')}</div></div>
      <div class="figure"><div class="num">${totalWalkKm.toFixed(1)}km</div><div class="lbl">${t('summary_walk_total')}</div></div>
      <div class="figure"><div class="num">${busSegments}${currentLang==='en' ? ' ' : ''}${t('summary_bus_segments')}</div><div class="lbl">${t('summary_bus_label')}</div></div>
      <div class="figure"><div class="num" style="color:${overClose?'#E39A82':'#fff'}">${overClose? t('summary_warn'):t('summary_ok')}</div><div class="lbl">${t('summary_nokyo_label')}</div></div>
    </div>
  `;

  let html = '';
  arrival.forEach((a, idx)=>{
    const temple = temples.find(t=>t.no===a.no);
    const isLast = idx === arrival.length-1;
    const nokyoOver = a.timeMin > NOKYO_CLOSE;
    const displayName = templeDisplayName(temple);

    html += `<div class="stop">
      <div class="stop-rail">
        <div class="stop-dot"></div>
        ${!isLast ? `<div class="stop-connector ${arrival[idx+1] && arrival[idx+1].mode==='bus' ? 'bus':''}"></div>` : ''}
        <div class="stop-time">${toHHMM(a.timeMin)}</div>
      </div>
      <div class="stop-card">
        <div class="stop-title"><span class="no">${String(temple.no).padStart(2,'0')}</span>${displayName}
          <span class="nokyo-badge ${nokyoOver?'nokyo-warn':'nokyo-ok'}">${nokyoOver? t('nokyo_warn') : t('nokyo_ok')}</span>
        </div>
        <div class="stop-meta mono">${temple.kana}</div>
        ${a.note ? `
          <div class="segment-note" onclick="openMapForIndex(${idx})">
            <span class="badge-mode ${a.mode}">${a.mode==='bus'?'BUS':'WALK'}</span>
            ${a.busResult && a.busResult.transfers === 1 ? `<span class="badge-mode transfer">${t('transfer_badge')}</span>` : ''}
            <b>${t('to_temple_km', displayName, a.distanceKm)}</b>：${a.note}
            <div class="map-link">${t('map_link')}</div>
          </div>` : ''}
      </div>
    </div>`;
  });
  document.getElementById('timeline').innerHTML = html;
}

let lastArrival = [];
let googleMap = null;
let mapOverlays = []; // 開き直すたびにクリアするマーカー・ポリラインの一覧
let mapReqToken = 0;

// Google Maps JS APIの読み込み完了を待つための仕組み
// (実体・コールバック関数本体は head 内で定義済み。ここではグローバルの状態を参照するだけ)
function waitForGoogleMaps(){
  if(window.__googleMapsReady) return Promise.resolve();
  return new Promise(function(resolve){ window.__googleMapsReadyWaiters.push(resolve); });
}

function clearMapOverlays(){
  mapOverlays.forEach(o=> o.setMap(null));
  mapOverlays = [];
}

// Directions APIで実際の道なりルートを取得
// mode: 'WALKING'(徒歩) または 'DRIVING'(バス経路の近似。本来はGTFS shapes.txtが理想)
function fetchRoute(from, to, travelMode){
  return new Promise((resolve, reject)=>{
    const service = new google.maps.DirectionsService();
    service.route({
      origin: { lat: from.lat, lng: from.lng },
      destination: { lat: to.lat, lng: to.lng },
      travelMode: google.maps.TravelMode[travelMode],
    }, (result, status)=>{
      if(status === 'OK' && result.routes && result.routes.length){
        const coords = result.routes[0].overview_path.map(p=>[p.lat(), p.lng()]);
        resolve({ coords });
      } else {
        reject(new Error(`Directions request failed: ${status}`));
      }
    });
  });
}

// 自前サーバー経由でOverpass(OpenStreetMap)に問い合わせ、沿道の目印を取得
async function fetchLandmarks(routeCoords, retried=false){
  const lats = routeCoords.map(c=>c[0]), lngs = routeCoords.map(c=>c[1]);
  const pad = 0.004;
  const bbox = [Math.min(...lats)-pad, Math.min(...lngs)-pad, Math.max(...lats)+pad, Math.max(...lngs)+pad].join(',');

  let data;
  try{
    const res = await fetch(`${API_BASE}/overpass-proxy?bbox=${encodeURIComponent(bbox)}`);
    if(!res.ok) throw new Error(`overpass-proxy failed (status ${res.status})`);
    data = await res.json();
  }catch(e){
    if(!retried){
      await new Promise(r=>setTimeout(r, 1500));
      return fetchLandmarks(routeCoords, true);
    }
    throw e;
  }

  const candidates = (data.elements||[])
    .filter(el => el.tags)
    .map(el => ({ lat:el.lat, lng:el.lon, name: el.tags.name || landmarkLabel(el.tags), tags:el.tags }))
    .map(p => ({ ...p, dist: distToPolyline(p.lat, p.lng, routeCoords), priority: landmarkPriority(p.tags) }))
    .filter(p => p.dist <= 180)
    .sort((a,b)=> (a.priority - b.priority) || (a.dist - b.dist));

  const picked = [];
  for(const c of candidates){
    if(picked.length >= 9) break;
    if(picked.some(p => p.name===c.name && metersBetween(p.lat,p.lng,c.lat,c.lng) < 150)) continue;
    picked.push(c);
  }
  return picked;
}

// 優先順位: トイレ > 宿泊施設 > 道の駅 > 温泉 > 自動販売機 > その他既存カテゴリ
function landmarkPriority(tags){
  if(tags.amenity==='toilets') return 1;
  if(tags.tourism && /hotel|guest_house|motel|hostel|ryokan/.test(tags.tourism)) return 2;
  if(tags.name && tags.name.includes('道の駅')) return 3;
  if(tags.amenity==='public_bath' || tags.natural==='hot_spring' || (tags.name && tags.name.includes('温泉'))) return 4;
  if(tags.amenity==='vending_machine') return 5;
  return 9;
}

function landmarkLabel(tags){
  if(tags.amenity==='toilets') return t('landmark_toilet');
  if(tags.tourism && /hotel|guest_house|motel|hostel|ryokan/.test(tags.tourism)) return t('landmark_lodging');
  if(tags.name && tags.name.includes('道の駅')) return t('landmark_roadside');
  if(tags.amenity==='public_bath' || tags.natural==='hot_spring' || (tags.name && tags.name.includes('温泉'))) return t('landmark_onsen');
  if(tags.amenity==='vending_machine') return t('landmark_vending');
  if(tags.amenity==='place_of_worship') return t('landmark_temple');
  if(tags.shop) return t('landmark_shop');
  if(tags.amenity==='cafe' || tags.amenity==='restaurant') return t('landmark_dining');
  if(tags.railway==='station') return t('landmark_station');
  if(tags.highway==='bus_stop') return t('landmark_busstop');
  if(tags.historic) return t('landmark_historic');
  if(tags.tourism) return t('landmark_tourism');
  return t('landmark_other');
}

function landmarkColor(tags){
  const p = landmarkPriority(tags);
  if(p===1) return '#2E7D32'; // トイレ: 緑
  if(p===2) return '#1D2B4F'; // 宿泊: 紺
  if(p===3) return '#AD8A50'; // 道の駅: 金
  if(p===4) return '#C0472C'; // 温泉: 朱
  if(p===5) return '#5B6B4F'; // 自販機: 落ち着いた緑
  if(tags.amenity==='place_of_worship') return '#7B4B94'; // 寺社: 紫
  if(tags.shop) return '#B5651D'; // 商店: 茶
  if(tags.amenity==='cafe' || tags.amenity==='restaurant') return '#D08A2E'; // 飲食: 橙
  if(tags.railway==='station') return '#2C6E8C'; // 駅: 青
  if(tags.highway==='bus_stop') return '#8C6E2C'; // バス停: 黄土色
  if(tags.historic) return '#5C4A3D'; // 史跡: こげ茶
  if(tags.tourism) return '#3C7A6E'; // 観光: 深緑がかった青
  return '#8a8578';
}

// 全カテゴリに絵文字アイコンを割り当て、地図上で一目でジャンルが分かるようにする
function landmarkGlyph(tags){
  const p = landmarkPriority(tags);
  if(p===1) return '🚻';
  if(p===2) return '🛏️';
  if(p===3) return '🛣️';
  if(p===4) return '♨️';
  if(p===5) return '🥤';
  if(tags.amenity==='place_of_worship') return '卍'; // 地図記号でおなじみの寺院マーク
  if(tags.shop) return '🏪';
  if(tags.amenity==='cafe' || tags.amenity==='restaurant') return '🍴';
  if(tags.railway==='station') return '🚉';
  if(tags.highway==='bus_stop') return '🚏';
  if(tags.historic) return '🏯';
  if(tags.tourism) return '📷';
  return '📍';
}

function drawPolyline(coords, color, dashed){
  const path = coords.map(c=>({lat:c[0], lng:c[1]}));
  const lineSymbol = { path:'M 0,-1 0,1', strokeOpacity:1, scale:3 };
  const line = new google.maps.Polyline({
    path,
    strokeColor: color,
    strokeOpacity: dashed ? 0 : 0.9,
    strokeWeight: 4,
    icons: dashed ? [{ icon: lineSymbol, offset:'0', repeat:'10px' }] : undefined,
    map: googleMap,
  });
  mapOverlays.push(line);
  return line;
}

function addPinMarker(position, color, label, title, scale, labelFontSize){
  const marker = new google.maps.Marker({
    position, map: googleMap, title,
    label: label ? { text:label, color:'#fff', fontSize: labelFontSize || '11px', fontWeight:'700' } : undefined,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: scale || 9,
      fillColor: color,
      fillOpacity: 1,
      strokeColor: '#fff',
      strokeWeight: 2,
    },
  });
  mapOverlays.push(marker);
  return marker;
}

function addLandmarkMarker(lm){
  const color = landmarkColor(lm.tags);
  const glyph = landmarkGlyph(lm.tags);
  const marker = addPinMarker({lat:lm.lat, lng:lm.lng}, color, glyph, lm.name, 10, '12px');
  marker.addListener('click', ()=>{
    new google.maps.InfoWindow({
      content: `<div style="font-family:'Noto Sans JP',sans-serif;font-size:12px;">${lm.name}</div>`
    }).open(googleMap, marker);
  });
}

function fitBoundsToCoords(coords){
  const bounds = new google.maps.LatLngBounds();
  coords.forEach(c=> bounds.extend({lat:c[0], lng:c[1]}));
  googleMap.fitBounds(bounds, 40);
}

// 徒歩区間の標高プロファイルを取得し、獲得標高(上り)・下り標高を計算する
async function fetchElevationProfile(coords){
  const { ElevationService } = await google.maps.importLibrary('elevation');
  const elevator = new ElevationService();
  const path = coords.map(c=>({lat:c[0], lng:c[1]}));
  const samples = Math.min(60, Math.max(2, coords.length));
  const response = await elevator.getElevationAlongPath({ path, samples });
  if(!response || !response.results) throw new Error('Elevation request returned no results');
  const elevations = response.results.map(r=>r.elevation);

  // サンプルは経路全体に等間隔に取られるため、経路の総距離から各点の距離を逆算する
  let totalDist = 0;
  for(let i=1;i<coords.length;i++){
    totalDist += metersBetween(coords[i-1][0], coords[i-1][1], coords[i][0], coords[i][1]);
  }
  const distances = elevations.map((_, i)=> totalDist * i/(elevations.length-1));
  return { elevations, distances, totalDist };
}
function elevationGainLoss(elevations){
  let gain=0, loss=0;
  for(let i=1;i<elevations.length;i++){
    const diff = elevations[i]-elevations[i-1];
    if(diff>0) gain+=diff; else loss += -diff;
  }
  return { gain: Math.round(gain), loss: Math.round(loss) };
}

// 一番大きな「連続した上り」区間を探す（横ばい・微小な上りは1つの区間としてまとめる）
function findBiggestClimb(elevations, distances){
  let best = { gain:0, startIdx:0, endIdx:0 };
  let i = 0;
  while(i < elevations.length-1){
    if(elevations[i+1] > elevations[i]){
      let j = i;
      while(j < elevations.length-1 && elevations[j+1] >= elevations[j]) j++;
      const gain = elevations[j] - elevations[i];
      if(gain > best.gain) best = { gain, startIdx:i, endIdx:j };
      i = j;
    } else {
      i++;
    }
  }
  return best;
}

// 標高プロファイルをシンプルな折れ線グラフ(SVG)として描画する
function buildElevationSvg(elevations, distances){
  const w=280, h=78, padX=6, padY=6, labelH=14; // labelH分は距離目盛り表示用に下に確保
  const chartH = h - labelH;
  const minE = Math.min(...elevations), maxE = Math.max(...elevations);
  const range = Math.max(1, maxE-minE);
  const totalDist = distances[distances.length-1] || 1;
  const pts = elevations.map((e,i)=>{
    const x = padX + (distances[i]/totalDist) * (w-2*padX);
    const y = (chartH-padY) - ((e-minE)/range) * (chartH-2*padY);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const area = `${padX},${chartH-padY} ${pts.join(' ')} ${w-padX},${chartH-padY}`;

  // 距離目盛り: 基本は1km刻み。区間が長い場合はラベルが重ならないよう間隔を自動で広げる(2/5/10/20km)
  const totalKm = totalDist/1000;
  const stepCandidates = [1,2,5,10,20,50];
  const stepKm = stepCandidates.find(s => totalKm/s <= 8) ?? 50;

  const xForKm = (km)=> padX + ((km*1000)/totalDist) * (w-2*padX);
  let gridLines = '';
  let labels = '';
  for(let km=0; km<=totalKm + 0.001; km+=stepKm){
    const x = xForKm(km);
    gridLines += `<line x1="${x.toFixed(1)}" y1="${padY}" x2="${x.toFixed(1)}" y2="${chartH}" stroke="rgba(43,40,37,0.08)" stroke-width="1"></line>`;
    const anchor = km===0 ? 'start' : (km>=totalKm-0.001 ? 'end' : 'middle');
    labels += `<text x="${x.toFixed(1)}" y="${h-2}" font-size="9" fill="#8a8578" font-family="JetBrains Mono, monospace" text-anchor="${anchor}">${km}km</text>`;
  }
  // 終端(合計距離)が最後の目盛りと近すぎない場合のみ、合計距離のラベルも追加しておく
  if(totalKm - Math.floor(totalKm/stepKm)*stepKm > stepKm*0.3){
    const x = xForKm(totalKm);
    labels += `<text x="${x.toFixed(1)}" y="${h-2}" font-size="9" fill="#8a8578" font-family="JetBrains Mono, monospace" text-anchor="end">${totalKm.toFixed(1)}km</text>`;
  }

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;margin-top:6px;">
    <polygon points="${area}" fill="rgba(91,107,79,0.22)"></polygon>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#5B6B4F" stroke-width="1.6"></polyline>
    <line x1="${padX}" y1="${chartH}" x2="${w-padX}" y2="${chartH}" stroke="rgba(43,40,37,0.15)" stroke-width="1"></line>
    ${gridLines}
    ${labels}
  </svg>`;
}

function showCurrentLocation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const { latitude, longitude } = pos.coords;
      addPinMarker({lat:latitude, lng:longitude}, '#2F6FED', null, t('current_location'), 10);
      const bounds = googleMap.getBounds();
      if(bounds){
        bounds.extend({lat:latitude, lng:longitude});
        googleMap.fitBounds(bounds, 40);
      }
    },
    (err)=> console.warn('現在地の取得に失敗しました（権限が許可されていない可能性があります）', err),
    { enableHighAccuracy:true, timeout:8000, maximumAge:30000 }
  );
}

function openMapForIndex(idx){
  const a = lastArrival[idx];
  const prev = lastArrival[idx-1];
  if(!a || !prev) return;
  openMap(prev.no, a.no, a.mode, a.note, a.distanceKm, a.busResult);
}

async function openMap(fromNo, toNo, mode, note, distanceKm, busResult){
  const from = temples.find(t=>t.no===fromNo);
  const to = temples.find(t=>t.no===toNo);
  const myToken = ++mapReqToken;

  document.getElementById('mapTitle').textContent = `${templeDisplayName(from)} → ${templeDisplayName(to)}`;
  const noLabel = currentLang==='en' ? '#' : '番';
  document.getElementById('mapSub').textContent = `${noLabel}${String(from.no).padStart(2,'0')} → ${noLabel}${String(to.no).padStart(2,'0')}｜${distanceKm}km`;
  document.getElementById('mapFoot').innerHTML =
    `<span class="badge-mode ${mode}">${mode==='bus'?'BUS':'WALK'}</span>${note}<br><span style="color:#8a8578;">${t('loading_route')}</span>`;

  document.getElementById('mapOverlay').classList.add('open');

  await waitForGoogleMaps();
  if(myToken !== mapReqToken) return;

  setTimeout(async ()=>{
    clearMapOverlays();
    googleMap = new google.maps.Map(document.getElementById('mapCanvas'), {
      center: { lat: from.lat, lng: from.lng },
      zoom: 13,
      disableDefaultUI: true,
      zoomControl: true,
      gestureHandling: 'greedy', // 1本指パン・ピンチズーム・2本指回転を全て地図側で処理する
    });

    addPinMarker({lat:from.lat, lng:from.lng}, '#1D2B4F', String(from.no).padStart(2,'0'), templeDisplayName(from), 13);
    addPinMarker({lat:to.lat, lng:to.lng}, '#A63A2A', String(to.no).padStart(2,'0'), templeDisplayName(to), 13);

    // 直通バスで、かつ停留所座標が両方揃っている場合だけ「徒歩→バス→徒歩」の3区間で描画。
    // 乗り換えルートは現状、乗換停留所の座標をAPIが返していないため簡易表示にフォールバック。
    const useBusStops = mode==='bus' && busResult && busResult.transfers !== 1
      && busResult.from_stop_lat && busResult.to_stop_lat;

    let allCoords = [];
    let walkOnlyCoords = []; // 標高計算の対象（徒歩区間のみ。バス乗車中の区間は対象外）
    let routeOk = false, routeErr = null;

    if(useBusStops){
      const fromStop = { lat:Number(busResult.from_stop_lat), lng:Number(busResult.from_stop_lon) };
      const toStop   = { lat:Number(busResult.to_stop_lat),   lng:Number(busResult.to_stop_lon) };
      try{
        const [walk1, busLeg, walk2] = await Promise.all([
          fetchRoute(from, fromStop, 'WALKING').catch(()=>({coords:[[from.lat,from.lng],[fromStop.lat,fromStop.lng]]})),
          fetchRoute(fromStop, toStop, 'DRIVING').catch(()=>({coords:[[fromStop.lat,fromStop.lng],[toStop.lat,toStop.lng]]})),
          fetchRoute(toStop, to, 'WALKING').catch(()=>({coords:[[toStop.lat,toStop.lng],[to.lat,to.lng]]})),
        ]);
        if(myToken !== mapReqToken) return;
        drawPolyline(walk1.coords, '#5B6B4F', false);
        drawPolyline(busLeg.coords, '#A63A2A', true);
        drawPolyline(walk2.coords, '#5B6B4F', false);
        addPinMarker(fromStop, '#A63A2A', null, busResult.from_stop_name || 'バス停', 7);
        addPinMarker(toStop, '#A63A2A', null, busResult.to_stop_name || 'バス停', 7);
        allCoords = [...walk1.coords, ...busLeg.coords, ...walk2.coords];
        walkOnlyCoords = [...walk1.coords, ...walk2.coords];
        routeOk = true;
      }catch(e){
        routeErr = e.message;
        allCoords = [[from.lat,from.lng],[to.lat,to.lng]];
        drawPolyline(allCoords, '#A63A2A', true);
      }
    } else {
      try{
        const travelMode = mode==='bus' ? 'DRIVING' : 'WALKING';
        const r = await fetchRoute(from, to, travelMode);
        if(myToken !== mapReqToken) return;
        allCoords = r.coords;
        if(mode!=='bus') walkOnlyCoords = allCoords; // バス(driving)区間は標高計算の対象外
        routeOk = true;
      }catch(e){
        routeErr = e.message;
        allCoords = [[from.lat,from.lng],[to.lat,to.lng]];
      }
      drawPolyline(allCoords, mode==='bus' ? '#A63A2A' : '#5B6B4F', mode==='bus');
    }

    fitBoundsToCoords(allCoords);
    showCurrentLocation();

    let elevationNote = '';
    if(walkOnlyCoords.length >= 2){
      try{
        const { elevations, distances } = await fetchElevationProfile(walkOnlyCoords);
        if(myToken !== mapReqToken) return;
        const { gain, loss } = elevationGainLoss(elevations);
        const climb = findBiggestClimb(elevations, distances);

        let climbText = '';
        if(climb.gain >= 20){ // 20m未満の小さな起伏は「最大の上り」として案内しない
          const startKm = (distances[climb.startIdx]/1000).toFixed(1);
          const endKm = (distances[climb.endIdx]/1000).toFixed(1);
          const lengthKm = ((distances[climb.endIdx]-distances[climb.startIdx])/1000).toFixed(1);
          climbText = t('elevation_climb', startKm, endKm, lengthKm, Math.round(climb.gain));
        }
        const svg = buildElevationSvg(elevations, distances);

        elevationNote = `<br><span style="color:#5a564f;">${t('elevation_stats', gain, loss)}　${climbText}</span>${svg}`;
      }catch(e){
        console.warn('elevation fetch failed', e);
      }
    }

    let landmarksOk = false, landmarks = [], lmErr = null;
    try{
      landmarks = await fetchLandmarks(allCoords);
      if(myToken !== mapReqToken) return;
      landmarksOk = true;
      // 出発・到着の札所自体は既に大きいピンで表示済みなので、目印一覧からは除外する
      landmarks = landmarks.filter(lm =>
        metersBetween(lm.lat, lm.lng, from.lat, from.lng) > 60 &&
        metersBetween(lm.lat, lm.lng, to.lat, to.lng) > 60
      );
      landmarks.forEach(addLandmarkMarker);
    }catch(e){
      lmErr = e.message;
    }

    const routeNote = routeOk
      ? (useBusStops ? t('route_shown_bus') : t('route_shown_direct'))
      : `<span style="color:#A63A2A;">${t('route_fail', routeErr)}</span>`;
    const lmNote = landmarksOk
      ? (landmarks.length ? t('landmarks_found', landmarks.length, landmarks.map(l=>{
          const label = landmarkLabel(l.tags);
          // トイレ・自販機など固有名称が無いものは name===label になるため、括弧書きの重複を避ける
          return l.name === label ? l.name : `${l.name}(${label})`;
        }).join(currentLang==='en' ? ', ' : '、'))
                           : t('landmarks_none'))
      : `<span style="color:#A63A2A;">${t('landmarks_fail', lmErr)}</span>`;

    document.getElementById('mapFoot').innerHTML =
      `<span class="badge-mode ${mode}">${mode==='bus'?'BUS':'WALK'}</span>${note}<br>
       <span style="color:#5a564f;">${routeNote}</span>${elevationNote}<br>
       <span style="color:#5a564f;">${lmNote}</span>`;
  }, 60);
}

function closeMap(){
  document.getElementById('mapOverlay').classList.remove('open');
}
</script>

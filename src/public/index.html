<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遍路みちしるべ ― 徒歩×公共交通 周遊プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
  // Google Mapsのスクリプトはasync読み込みのため、下部の本体スクリプトが
  // 実行される前にコールバックが呼ばれることがある。そのため、この受け皿だけは
  // ページの一番早い段階（headの中）で先に定義しておく。
  window.__googleMapsReady = false;
  window.__googleMapsReadyWaiters = [];
  function __initGoogleMaps(){
    window.__googleMapsReady = true;
    window.__googleMapsReadyWaiters.forEach(function(fn){ fn(); });
    window.__googleMapsReadyWaiters = [];
  }

  // Google Maps自体の表示言語(地名・コントロール等)は読み込み時のパラメータでしか
  // 指定できないため、保存済みの言語設定をここで読み取ってスクリプトタグを動的に生成する。
  (function(){
    var savedLang = localStorage.getItem('ohenro_lang') || 'ja';
    var mapsScript = document.createElement('script');
    mapsScript.async = true;
    mapsScript.src = 'https://maps.googleapis.com/maps/api/js?key={{GOOGLE_MAPS_API_KEY}}&language=' + savedLang + '&region=JP&loading=async&callback=__initGoogleMaps';
    document.head.appendChild(mapsScript);
  })();
</script>
<style>
  :root{
    --indigo-deep:#1D2B4F;
    --indigo-mid:#33507A;
    --washi:#EFE6D6;
    --washi-panel:#F7F1E6;
    --sumi:#2B2825;
    --vermillion:#A63A2A;
    --gold:#AD8A50;
    --line-walk:#5B6B4F;
    --line-bus:#A63A2A;
    --warn-bg:#F4E2DA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--washi);
    color:var(--sumi);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .hero{
    background:
      radial-gradient(circle at 85% -10%, rgba(255,255,255,0.06), transparent 55%),
      var(--indigo-deep);
    color:var(--washi);
    padding:48px 24px 40px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-40px; bottom:-60px;
    width:260px; height:260px;
    border:1px solid rgba(239,230,214,0.15);
    border-radius:50%;
    pointer-events:none;
  }
  .hero-top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    position:relative;
    z-index:1;
  }
  .hero-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:0;
  }
  .lang-switch select{
    background:var(--indigo-deep);
    color:var(--washi);
    border:1px solid rgba(239,230,214,0.35);
    border-radius:2px;
    padding:5px 10px;
    font-size:12px;
    font-family:'Noto Sans JP', sans-serif;
    cursor:pointer;
  }
  .hero-title-row{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:1;
  }
  .hero h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:clamp(28px, 4vw, 40px);
    margin:0;
    line-height:1.3;
  }
  .info-btn{
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid rgba(239,230,214,0.5);
    background:transparent;
    color:rgba(239,230,214,0.85);
    font-family:'Noto Serif JP', serif;
    font-style:italic;
    font-size:13px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }
  .info-btn:hover, .info-btn:focus{
    background:rgba(239,230,214,0.15);
  }
  .info-tooltip{
    display:none;
    max-width:640px;
    font-size:13.5px;
    line-height:1.9;
    color:rgba(239,230,214,0.88);
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(239,230,214,0.2);
    border-radius:4px;
    padding:14px 16px;
    margin-top:14px;
  }
  .info-tooltip.open{ display:block; }

  .wrap{ max-width:920px; margin:0 auto; padding:0 24px; }

  .panel{
    background:var(--washi-panel);
    border:1px solid rgba(43,40,37,0.1);
    border-radius:4px;
    padding:28px;
    margin-top:-28px;
    position:relative;
    z-index:2;
    box-shadow:0 12px 30px rgba(29,43,79,0.08);
  }

  .controls{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  /* 出発する札所・到着したい札所だけは横幅に余裕があるので2列で並べる */
  @media (min-width:640px){
    .controls{ grid-template-columns:1fr 1fr; }
    .controls .field-full{ grid-column:1/-1; }
  }

  label{
    display:block;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--indigo-mid);
    margin-bottom:6px;
    font-weight:700;
  }
  select, input[type=time]{
    width:100%;
    padding:10px 12px;
    border:1px solid rgba(43,40,37,0.25);
    border-radius:2px;
    background:#fff;
    font-family:'Noto Sans JP', sans-serif;
    font-size:14px;
    color:var(--sumi);
  }
  .date-fields, .time-fields{
    display:flex;
    gap:4px;
  }
  .date-fields select, .time-fields select{
    padding:8px 4px;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .date-fields select.df-year{ flex:0 0 78px; }
  .date-fields select.df-month{ flex:0 0 auto; width:auto; }
  .date-fields select.df-day{ flex:0 0 58px; }
  .time-fields select.tf-hour, .time-fields select.tf-minute{ flex:0 0 52px; text-align:center; }
  .time-fields .tf-colon{
    display:flex;
    align-items:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    color:var(--indigo-mid);
  }
  .mode-toggle{
    display:flex;
    border:1px solid var(--indigo-mid);
    border-radius:2px;
    overflow:hidden;
    height:41px;
  }
  .mode-toggle button{
    flex:1;
    border:none;
    background:#fff;
    color:var(--indigo-mid);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .mode-toggle button.active{
    background:var(--indigo-mid);
    color:#fff;
  }

  .run-btn{
    grid-column:1/-1;
    margin-top:4px;
    background:var(--vermillion);
    color:#fff;
    border:none;
    padding:13px 20px;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.03em;
    border-radius:2px;
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .run-btn:hover{ filter:brightness(1.08); }
  .locate-btn{
    margin-top:6px;
    width:100%;
    background:none;
    border:1px dashed var(--indigo-mid);
    color:var(--indigo-mid);
    font-size:11.5px;
    padding:6px 8px;
    border-radius:2px;
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .locate-btn:hover{ background:rgba(51,80,122,0.08); }
  .share-btn{
    grid-column:1/-1;
    margin-top:8px;
    background:none;
    border:1px solid var(--indigo-mid);
    color:var(--indigo-mid);
    padding:10px 20px;
    font-size:13px;
    font-weight:700;
    border-radius:2px;
    cursor:pointer;
    font-family:'Noto Sans JP', sans-serif;
  }
  .share-btn:hover{ background:rgba(51,80,122,0.06); }
  .progress-bar{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--indigo-mid);
    background:var(--washi);
    border:1px solid rgba(43,40,37,0.1);
    border-radius:2px;
    padding:8px 12px;
    margin-bottom:18px;
  }
  .visited-toggle{
    background:none;
    border:none;
    cursor:pointer;
    font-size:15px;
    margin-left:6px;
    vertical-align:middle;
    color:var(--gold);
  }
  .honzon-toggle{
    display:inline-block;
    font-size:11px;
    color:var(--indigo-mid);
    text-decoration:underline;
    cursor:pointer;
    margin-top:2px;
  }
  .honzon-info{
    display:none;
    font-size:12.5px;
    color:#5a564f;
    background:var(--washi);
    border:1px solid rgba(43,40,37,0.1);
    border-radius:2px;
    padding:6px 10px;
    margin-top:4px;
  }
  .honzon-info.open{ display:block; }

  .legend{
    display:flex;
    gap:22px;
    margin:26px 0 6px;
    font-size:12.5px;
    color:var(--indigo-mid);
    flex-wrap:wrap;
  }
  .legend span{ display:flex; align-items:center; gap:7px; }
  .swatch{ width:20px; height:3px; display:inline-block; }
  .swatch.walk{ background:var(--line-walk); }
  .swatch.bus{ background:none; border-top:2px dashed var(--line-bus); height:0; width:20px; }

  .timeline{ margin:18px 0 40px; position:relative; }
  .stop{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:18px;
    position:relative;
  }
  .stop-rail{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .stop-dot{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--indigo-deep);
    border:3px solid var(--washi-panel);
    outline:1px solid rgba(43,40,37,0.2);
    z-index:2;
    margin-top:6px;
  }
  .stop-connector{
    flex:1;
    width:0;
    border-left:2px solid var(--line-walk);
    margin:2px 0;
  }
  .stop-connector.bus{
    border-left:2px dashed var(--line-bus);
  }
  .stop-time{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--indigo-mid);
    margin-top:4px;
  }

  .stop-card{
    padding:14px 0 26px;
  }
  .stop-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:17px;
    margin:2px 0 4px;
  }
  .stop-title .no{
    color:var(--vermillion);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    margin-right:8px;
  }
  .stop-meta{ font-size:12.5px; color:#5a564f; margin-bottom:8px; }
  .nokyo-badge{
    display:inline-block;
    font-size:11px;
    padding:3px 8px;
    border-radius:2px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .nokyo-ok{ background:#E4EBDD; color:#3E5A2C; }
  .nokyo-warn{ background:var(--warn-bg); color:var(--vermillion); }

  .segment-note{
    margin-top:8px;
    font-size:13px;
    background:#fff;
    border:1px solid rgba(43,40,37,0.1);
    border-radius:2px;
    padding:12px 14px;
    line-height:1.7;
    cursor:pointer;
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  .segment-note:hover{
    border-color:var(--indigo-mid);
    box-shadow:0 3px 10px rgba(29,43,79,0.1);
  }
  .segment-note .map-link{
    margin-top:8px;
    font-size:11px;
    color:var(--indigo-mid);
    font-family:'JetBrains Mono', monospace;
    text-align:right;
  }
  .segment-note b{ color:var(--indigo-deep); }
  .badge-mode{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    padding:2px 6px;
    border-radius:2px;
    margin-right:6px;
    font-weight:700;
  }
  .badge-mode.walk{ background:#E7EBE0; color:var(--line-walk); }
  .badge-mode.bus{ background:#F4E2DA; color:var(--line-bus); }
  .badge-mode.transfer{ background:#EFE3C8; color:var(--gold); margin-left:4px; }

  .summary{
    background:var(--indigo-deep);
    color:var(--washi);
    border-radius:4px;
    padding:22px 24px;
    margin-bottom:44px;
    display:flex;
    gap:32px;
    flex-wrap:wrap;
  }
  .summary .figure{ min-width:120px; }
  .summary .figure .num{
    font-family:'JetBrains Mono', monospace;
    font-size:26px;
    font-weight:700;
    color:#fff;
  }
  .summary .figure .lbl{
    font-size:11px;
    letter-spacing:0.06em;
    color:rgba(239,230,214,0.7);
    text-transform:uppercase;
    margin-top:2px;
  }

  .footnote{
    font-size:12px;
    color:#8a8578;
    line-height:1.8;
    padding-bottom:40px;
  }

  .map-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(29,43,79,0.55);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .map-overlay.open{ display:flex; }
  .map-modal{
    background:var(--washi-panel);
    border-radius:4px;
    width:100%;
    max-width:640px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .map-modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    background:var(--indigo-deep);
    color:var(--washi);
  }
  .map-modal-head h3{
    font-family:'Noto Serif JP', serif;
    font-size:16px;
    margin:0;
    font-weight:700;
  }
  .map-modal-head .sub{
    font-size:11px;
    color:rgba(239,230,214,0.7);
    font-family:'JetBrains Mono', monospace;
    margin-top:2px;
  }
  .map-close{
    background:none;
    border:1px solid rgba(239,230,214,0.4);
    color:var(--washi);
    width:28px; height:28px;
    border-radius:50%;
    cursor:pointer;
    font-size:15px;
    line-height:1;
  }
  #mapCanvas{ width:100%; height:360px; }
  .map-modal-foot{
    padding:12px 18px 16px;
    font-size:12px;
    color:#5a564f;
    line-height:1.7;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="hero-top-row">
      <div class="hero-eyebrow">Ohenro Route Planner</div>
      <div class="lang-switch">
        <select onchange="setLanguage(this.value)" id="langSelect">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
        </select>
      </div>
    </div>
    <div class="hero-title-row">
      <h1 data-i18n="hero_title"></h1>
      <button class="info-btn" onclick="toggleHeroInfo()" aria-label="info">i</button>
    </div>
    <div class="info-tooltip" id="heroInfoTooltip" data-i18n="hero_desc"></div>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="progress-bar" id="progressLabel"></div>
    <div class="controls">
      <div>
        <label data-i18n="label_start"></label>
        <select id="startTemple"></select>
        <button type="button" class="locate-btn" onclick="setStartFromLocation()" data-i18n="btn_locate"></button>
      </div>
      <div>
        <label data-i18n="label_end"></label>
        <select id="endTemple"></select>
      </div>
      <div>
        <label data-i18n="label_date"></label>
        <div class="date-fields" id="dateFields"></div>
      </div>
      <div>
        <label data-i18n="label_time"></label>
        <div class="time-fields" id="timeFields"></div>
      </div>
      <div class="field-full">
        <label data-i18n="label_mode"></label>
        <div class="mode-toggle">
          <button id="modeEfficient" class="active" data-i18n="mode_efficient"></button>
          <button id="modeWalk" data-i18n="mode_walk"></button>
        </div>
      </div>
      <button class="run-btn" onclick="runPlanner()" data-i18n="btn_run"></button>
      <button class="share-btn" onclick="sharePlan()" data-i18n="btn_share"></button>
    </div>

    <div class="legend">
      <span><span class="swatch walk"></span><span data-i18n="legend_walk"></span></span>
      <span><span class="swatch bus"></span><span data-i18n="legend_bus"></span></span>
      <span class="mono" style="color:#8a8578;" data-i18n="legend_nokyo"></span>
    </div>

    <div id="summary"></div>
    <div class="timeline" id="timeline"></div>

    <div class="footnote" data-i18n="footnote"></div>
    <div class="footnote">
      <a href="/privacy" target="_blank" rel="noopener" style="color:#8a8578;">Privacy Policy</a>
      　|　
      <a href="/credits" target="_blank" rel="noopener" style="color:#8a8578;">Credits / データ提供元</a>
    </div>
  </div>
</div>

<div class="map-overlay" id="mapOverlay">
  <div class="map-modal">
    <div class="map-modal-head">
      <div>
        <h3 id="mapTitle"></h3>
        <div class="sub" id="mapSub"></div>
      </div>
      <button class="map-close" onclick="closeMap()">&times;</button>
    </div>
    <div id="mapCanvas"></div>
    <div class="map-modal-foot" id="mapFoot"></div>
  </div>
</div>

<script>
// ==================================================================
// ---- 多言語対応（i18n） ----
// ==================================================================
// 共有されたリンクを開いた場合は、URLのlangパラメータ(送信者が選んだ言語)を優先する。
// 通常のアクセスでは、端末に保存済みの言語設定(localStorage)を使う。
const __urlLang = new URLSearchParams(location.search).get('lang');
let currentLang = __urlLang || localStorage.getItem('ohenro_lang') || 'ja';
if(__urlLang) localStorage.setItem('ohenro_lang', __urlLang);

const I18N = {
  ja: {
    hero_title: 'お遍路みちしるべ',
    hero_desc: '四国八十八ヶ所すべてを対象にした周遊プランナーです。<br>区間距離とバスダイヤをもとに、納経所が開いている時間内に次の札所へ着けるかを計算し、徒歩とバスのどちらが良いか区間ごとに提案します。<br>順打ち（1→88番）・逆打ち（88→1番）のどちらにも対応しています。<br>徒歩時間は、事前計算済みの区間は実際の道のり、未計算の区間は直線距離からの概算です。<br>※現在バスの実データが整備済みなのは徳島・高知・香川の一部エリアのみです。それ以外の区間は「バス便が見つかりません」と表示され、徒歩での計算になります。',
    label_start: '出発する札所',
    label_end: '到着したい札所',
    label_date: '出発日',
    label_time: '出発時刻',
    label_mode: '優先モード',
    mode_efficient: '効率優先',
    mode_walk: '徒歩優先',
    btn_run: 'ルートを計算する',
    legend_walk: '徒歩区間',
    legend_bus: 'バス区間',
    legend_nokyo: '納経所 標準受付 7:00–17:00 として計算',
    footnote: '※ バス時刻は各バス会社の公開データに基づいています。徒歩時間は実際の道のりをもとに概算しています。祝日はダイヤが異なる場合があります。',
    map_title: '区間の地図',
    summary_arrival: '最終到着予想',
    summary_walk_total: '徒歩合計距離',
    summary_bus_segments: '区間',
    summary_bus_label: 'バス利用区間',
    summary_nokyo_label: '最終札所の納経所',
    summary_ok: 'OK',
    summary_warn: '要注意',
    nokyo_ok: '納経受付時間内',
    nokyo_warn: '納経受付終了後の可能性',
    err_same_temple: '出発と到着が同じ札所です。異なる札所を選んでください。',
    loading_route: 'ルートを取得中…',
    loading_temples: '札所データを読み込み中…',
    err_temples: '札所データの取得に失敗しました。しばらくしてから、もう一度お試しください。',
    walk_mode_note: '徒歩優先モード',
    bus_no_service: 'この時間以降、実データ上でバス便が見つかりません → 徒歩',
    bus_fetch_error: 'バス情報の取得に失敗しました（通信エラー） → 徒歩で計算',
    walk_faster: (dep)=>`バス(${dep}発)より徒歩の方が早いため徒歩を推奨`,
    bus_direct: (agency,dep,arr)=>`${agency}｜${dep}発 → ${arr}着`,

// 現在の計画(出発・到着札所、日付、時刻、言語)を、URL一つで共有できるようにする
async function sharePlan(){
  const params = new URLSearchParams();
  params.set('from', startSel.value);
  params.set('to', endSel.value);
  params.set('date', getSelectedDateStr());
  params.set('time', getSelectedTimeStr());
  params.set('lang', currentLang);
  const shareUrl = `${location.origin}${location.pathname}?${params.toString()}`;

  try{
    if(navigator.share){
      await navigator.share({ title: t('hero_title').replace(/<br>/g,' '), url: shareUrl });
      return;
    }
  }catch(e){
    // ユーザーがシェアシートをキャンセルした場合等はここに来るが、エラー扱いしない
    if(e && e.name === 'AbortError') return;
  }

  // Web Share API が無い環境(PCブラウザ等)ではクリップボードにコピーする
  try{
    await navigator.clipboard.writeText(shareUrl);
    alert(t('share_copied'));
  }catch(e){
    console.warn('share failed', e);
    alert(t('share_failed'));
  }
}

function setLanguage(lang){
  if(lang === currentLang) return;
  localStorage.setItem('ohenro_lang', lang);
  // Google Maps自体の表示言語は再読み込みしないと切り替わらないため、
  // ページごと再読み込みする（選択中の出発・到着札所・日付・時刻は保持する）
  const params = new URLSearchParams(location.search);
  if(startSel.value) params.set('from', startSel.value);
  if(endSel.value) params.set('to', endSel.value);
  params.set('date', getSelectedDateStr());
  params.set('time', getSelectedTimeStr());
  location.search = params.toString();
}

// ---- 88札所データ（自前サーバーAPI経由。src/data/temples_88.json が単一の情報源）----
const API_BASE = ''; // 同一オリジンから配信するため空文字（相対パス）でOK
let temples = [];

const startSel = document.getElementById('startTemple');
const endSel = document.getElementById('endTemple');

function metersBetween(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function distToPolyline(lat, lng, coords){
  let min = Infinity;
  for(const [clat, clng] of coords){
    const d = metersBetween(lat, lng, clat, clng);
    if(d < min) min = d;
  }
  return min;
}

async function loadTemples(){
  const res = await fetch(`${API_BASE}/temples`);
  if(!res.ok) throw new Error(`temples API responded ${res.status}`);
  const raw = await res.json();
  raw.sort((a,b)=>a.no-b.no);
  temples = raw.map((t, i) => {
    const prev = raw[i-1];
    // 実測値(Google Directionsで事前計算済み)があればそれを使い、無ければ直線距離で概算
    const hasReal = t.walkDistanceKm != null && t.walkDurationMin != null;
    const straightKm = prev ? metersBetween(prev.lat, prev.lng, t.lat, t.lng)/1000 : 0;
    return {
      no: t.no, name: t.name, kana: '',
      distanceKm: hasReal ? t.walkDistanceKm : Math.round(straightKm*10)/10,
      walkDurationMin: hasReal ? t.walkDurationMin : null, // nullなら時速4km換算にフォールバック
      isRealWalkData: hasReal,
      lat: t.lat, lng: t.lng,
    };
  });
}

// 区間の徒歩時間(分)を返す。実測値があればそれを、無ければ距離÷時速4kmで概算する。
function walkMinutesFor(temple){
  if(temple.isRealWalkData && temple.walkDurationMin != null) return temple.walkDurationMin;
  return temple.distanceKm / 4 * 60;
}

function getVisitedSet(){
  try{ return new Set(JSON.parse(localStorage.getItem('ohenro_visited') || '[]')); }
  catch(e){ return new Set(); }
}
function saveVisitedSet(set){
  localStorage.setItem('ohenro_visited', JSON.stringify([...set]));
}
function isVisited(no){
  return getVisitedSet().has(no);
}

function setStartFromLocation(){
  if(!navigator.geolocation){
    alert(t('locate_unsupported'));
    return;
  }
  const btn = document.querySelector('.locate-btn');
  const originalText = btn.textContent;
  btn.textContent = t('locate_searching');
  btn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const { latitude, longitude } = pos.coords;
      let nearest = null, minDist = Infinity;
      temples.forEach(temple=>{
        const d = metersBetween(latitude, longitude, temple.lat, temple.lng);
        if(d < minDist){ minDist = d; nearest = temple; }
      });
      btn.textContent = originalText;
      btn.disabled = false;
      if(nearest){
        startSel.value = nearest.no;
        runPlanner();
      }
    },
    (err)=>{
      console.warn('現在地の取得に失敗しました', err);
      btn.textContent = originalText;
      btn.disabled = false;
      alert(t('locate_failed'));
    },
    { enableHighAccuracy:true, timeout:8000, maximumAge:30000 }
  );
}

// ==================================================================
// ---- カスタム日付選択（年・月・日をそれぞれ選ぶ形式） ----
// ブラウザ標準の<input type="date">は、カレンダーの表示言語がOS/ブラウザの
// システム言語に依存してしまい、アプリ内で選んだ言語と一致させられないため、
// 独自実装に置き換えている。月名の翻訳はIntl.DateTimeFormatを使い、
// ブラウザ内蔵のロケールデータから正確な表記を取得する。
// ==================================================================

// 言語ごとの年・月・日の並び順（東アジア圏は年→月→日、それ以外は日→月→年が一般的）
const DATE_FIELD_ORDER = {
  ja: ['year','month','day'], ko: ['year','month','day'],
  'zh-CN': ['year','month','day'], 'zh-TW': ['year','month','day'],
  en: ['month','day','year'], de: ['day','month','year'], pt: ['day','month','year'],
};
// Intl.DateTimeFormat用のロケールコード（currentLangの内部表記とほぼ同じだが明示しておく）
const INTL_LOCALES = { ja:'ja', en:'en', ko:'ko', 'zh-CN':'zh-CN', 'zh-TW':'zh-TW', de:'de', pt:'pt' };

function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); } // month:1-12

// 「2日」「2nd」「2.」のような、言語ごとの日付の言い回しに合わせたラベルを返す
function ordinalEn(n){
  const suffixes = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (suffixes[(v-20)%10] || suffixes[v] || suffixes[0]);
}
function dayLabel(day){
  switch(currentLang){
    case 'ja': return `${day}日`;
    case 'ko': return `${day}일`;
    case 'zh-CN': case 'zh-TW': return `${day}日`;
    case 'de': return `${day}.`;
    case 'en': return ordinalEn(day);
    default: return String(day); // pt等: 数字そのまま
  }
}
function yearLabel(year){
  switch(currentLang){
    case 'ja': return `${year}年`;
    case 'ko': return `${year}년`;
    case 'zh-CN': case 'zh-TW': return `${year}年`;
    default: return String(year); // en/de/pt: 数字そのまま
  }
}
// 中国語(簡体字/繁体字)は「八月」のような漢数字表記でなく「8月」の数字表記にする。
// 日本語・韓国語はIntlの'long'指定でも数字表記(8月/8월)になるためそのままIntlを使う。
function monthLabel(m, locale){
  if(currentLang === 'zh-CN' || currentLang === 'zh-TW') return `${m}月`;
  return new Intl.DateTimeFormat(locale, { month:'long' }).format(new Date(2000, m-1, 1));
}

// 端末のタイムゾーン設定（インバウンド利用者は母国のタイムゾーンのままのことが多い）に
// 関わらず、常に日本時間(JST, UTC+9)を基準にするための関数。
function getJSTNow(){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Tokyo', hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
  }).formatToParts(new Date());
  const get = (type) => Number(parts.find(p => p.type === type).value);
  return {
    year: get('year'), month: get('month'), day: get('day'),
    hour: get('hour') % 24, minute: get('minute'), // 'hour'が"24"を返す実装対策でmod
  };
}

function buildDateFields(presetDate){
  const container = document.getElementById('dateFields');
  if(!container) return;
  const jstNow = getJSTNow();
  const preset = presetDate || new Date(jstNow.year, jstNow.month-1, jstNow.day);
  const order = DATE_FIELD_ORDER[currentLang] || DATE_FIELD_ORDER.ja;
  const locale = INTL_LOCALES[currentLang] || 'ja';

  const yearSel = document.createElement('select');
  yearSel.className = 'df-year';
  const thisYear = jstNow.year;
  for(let y=thisYear; y<=thisYear+1; y++){
    yearSel.insertAdjacentHTML('beforeend', `<option value="${y}">${yearLabel(y)}</option>`);
  }

  const monthSel = document.createElement('select');
  monthSel.className = 'df-month';
  for(let m=1; m<=12; m++){
    monthSel.insertAdjacentHTML('beforeend', `<option value="${m}">${monthLabel(m, locale)}</option>`);
  }

  const daySel = document.createElement('select');
  daySel.className = 'df-day';
  function rebuildDayOptions(){
    const y = Number(yearSel.value), m = Number(monthSel.value);
    const maxDay = daysInMonth(y, m);
    const prevSelected = Number(daySel.value) || preset.getDate();
    daySel.innerHTML = '';
    for(let d=1; d<=maxDay; d++){
      daySel.insertAdjacentHTML('beforeend', `<option value="${d}">${dayLabel(d)}</option>`);
    }
    daySel.value = Math.min(prevSelected, maxDay);
  }

  yearSel.value = preset.getFullYear();
  monthSel.value = preset.getMonth()+1;
  rebuildDayOptions();
  daySel.value = preset.getDate();

  yearSel.onchange = rebuildDayOptions;
  monthSel.onchange = rebuildDayOptions;

  container.innerHTML = '';
  const fields = { year: yearSel, month: monthSel, day: daySel };
  order.forEach(key => container.appendChild(fields[key]));
}

function getSelectedDateObj(){
  const y = Number(document.querySelector('#dateFields .df-year')?.value);
  const m = Number(document.querySelector('#dateFields .df-month')?.value);
  const d = Number(document.querySelector('#dateFields .df-day')?.value);
  if(!y || !m || !d) return new Date();
  return new Date(y, m-1, d);
}
function getSelectedDateStr(){
  const dt = getSelectedDateObj();
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

// 時刻選択（24時間制の数字表記に統一。数字なので翻訳・AM/PM表記の言語差を気にしなくてよい）
function buildTimeFields(presetHHMM){
  const container = document.getElementById('timeFields');
  if(!container) return;
  const jstNow = getJSTNow();
  const currentHHMM = `${String(jstNow.hour).padStart(2,'0')}:${String(jstNow.minute).padStart(2,'0')}`;
  const [presetH, presetM] = (presetHHMM || currentHHMM).split(':').map(Number);

  const hourSel = document.createElement('select');
  hourSel.className = 'tf-hour';
  for(let h=0; h<24; h++){
    hourSel.insertAdjacentHTML('beforeend', `<option value="${h}">${String(h).padStart(2,'0')}</option>`);
  }
  hourSel.value = presetH;

  const minuteSel = document.createElement('select');
  minuteSel.className = 'tf-minute';
  for(let m=0; m<60; m++){
    minuteSel.insertAdjacentHTML('beforeend', `<option value="${m}">${String(m).padStart(2,'0')}</option>`);
  }
  minuteSel.value = presetM;

  container.innerHTML = '';
  container.appendChild(hourSel);
  container.insertAdjacentHTML('beforeend', '<span class="tf-colon">:</span>');
  container.appendChild(minuteSel);
}
function getSelectedTimeStr(){
  const h = document.querySelector('#timeFields .tf-hour')?.value ?? '7';
  const m = document.querySelector('#timeFields .tf-minute')?.value ?? '30';
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

async function fetchNextBus(fromNo, toNo, timeStr, dateStr){
  try{
    const url = `${API_BASE}/next-bus?from=${fromNo}&to=${toNo}&time=${encodeURIComponent(timeStr)}&date=${dateStr}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`API responded ${res.status}`);
    const data = await res.json();
    return data.result;
  }catch(e){
    console.warn('next-bus API fetch failed', e);
    return undefined;
  }
}

async function runPlanner(){
  const startNo = Number(startSel.value);
  const endNo = Number(endSel.value);
  const startTimeStr = getSelectedTimeStr();
  const startDateStr = getSelectedDateStr();

  if(startNo === endNo){
    document.getElementById('timeline').innerHTML =
      `<div class="segment-note">${t('err_same_temple')}</div>`;
    document.getElementById('summary').innerHTML = '';
    return;
  }

  document.getElementById('timeline').innerHTML = `<div class="segment-note">${t('loading_route')}</div>`;
  document.getElementById('summary').innerHTML = '';

  // 順打ち(番号が小さい→大きい)・逆打ち(大きい→小さい)の両方に対応
  const isReverse = startNo > endNo;
  const lo = Math.min(startNo, endNo), hi = Math.max(startNo, endNo);
  const inRange = temples.filter(t=>t.no>=lo && t.no<=hi).sort((a,b)=>a.no-b.no);
  const route = isReverse ? [...inRange].reverse() : inRange;

  // 隣接する2札所間の区間距離(distanceKm)は、番号が大きい方の札所に保持されている
  // (loadTemples()で「1つ前の札所からの距離」として格納しているため)。
  // 順打ち・逆打ちどちらでも、区間の両端のうち番号が大きい方を見れば同じ値が取れる。
  function segmentInfo(templeA, templeB){
    const higher = temples.find(t=>t.no===Math.max(templeA.no, templeB.no));
    return { distanceKm: higher.distanceKm, walkMin: walkMinutesFor(higher) };
  }

  let currentMin = toMinutes(startTimeStr);
  let totalWalkKm = 0, busSegments = 0, walkSegments = 0;
  const NOKYO_CLOSE = toMinutes('17:00');

  const arrival = [{ no:route[0].no, timeMin: currentMin, mode:null, note:null }];

  for(let i=1;i<route.length;i++){
    const seg = route[i];
    const prevNo = route[i-1].no;
    const { distanceKm, walkMin } = segmentInfo(route[i-1], seg);
    let chosen, arriveMin, note, missedBus=false, busResult=null;

    const walkArrive = currentMin + walkMin;

    if(mode==='efficient'){
      // バス停までの徒歩時間は、停留所ごとの実距離をもとにサーバー側で正確に計算するため、
      // ここでは現在時刻をそのまま渡すだけでよい。
      busResult = await fetchNextBus(prevNo, seg.no, toHHMM(currentMin), startDateStr);

      if(busResult === undefined){
        chosen = 'walk';
        arriveMin = walkArrive;
        note = t('bus_fetch_error');
      } else if(busResult){
        const busArrive = busResult.arrivalMin;
        if(busArrive < walkArrive){
          chosen = 'bus';
          arriveMin = busArrive;
          note = busResult.transfers === 1
            ? t('bus_transfer', agencyDisplayName(busResult.agency_key), hhmm(busResult.from_departure), busResult.mid_stop_name, hhmm(busResult.mid_arrival), hhmm(busResult.mid_departure), hhmm(busResult.to_arrival))
            : t('bus_direct', agencyDisplayName(busResult.agency_key), hhmm(busResult.from_departure), hhmm(busResult.to_arrival));
          // 運賃データがあれば末尾に追記する（無いフィードも多いため、無ければ何も表示しない）
          if(busResult.farePrice != null){
            const amount = busResult.fareCurrency === 'JPY' || !busResult.fareCurrency
              ? `¥${Math.round(busResult.farePrice)}`
              : `${Math.round(busResult.farePrice)} ${busResult.fareCurrency}`;
            note += t('fare_label', amount);
          }
        } else {
          chosen = 'walk';
          arriveMin = walkArrive;
          note = t('walk_faster', hhmm(busResult.from_departure));
        }
      } else {
        chosen = 'walk';
        arriveMin = walkArrive;
        note = t('bus_no_service');
        missedBus = true;
      }
    } else {
      chosen = 'walk';
      arriveMin = walkArrive;
      note = t('walk_mode_note');
    }

    if(chosen==='bus') busSegments++; else { walkSegments++; totalWalkKm += distanceKm; }

    currentMin = arriveMin;
    arrival.push({ no:seg.no, timeMin:currentMin, mode:chosen, note, distanceKm, missedBus, busResult: chosen==='bus' ? busResult : null });
  }

  lastArrival = arrival;

  const finalMin = arrival[arrival.length-1].timeMin;
  const overClose = finalMin > NOKYO_CLOSE;
  document.getElementById('summary').innerHTML = `
    <div class="summary">
      <div class="figure"><div class="num">${toHHMM(finalMin)}</div><div class="lbl">${t('summary_arrival')}</div></div>
      <div class="figure"><div class="num">${totalWalkKm.toFixed(1)}km</div><div class="lbl">${t('summary_walk_total')}</div></div>
      <div class="figure"><div class="num">${busSegments}${currentLang==='en' ? ' ' : ''}${t('summary_bus_segments')}</div><div class="lbl">${t('summary_bus_label')}</div></div>
      <div class="figure"><div class="num" style="color:${overClose?'#E39A82':'#fff'}">${overClose? t('summary_warn'):t('summary_ok')}</div><div class="lbl">${t('summary_nokyo_label')}</div></div>
    </div>
  `;

  let html = '';
  arrival.forEach((a, idx)=>{
    const temple = temples.find(t=>t.no===a.no);
    const isLast = idx === arrival.length-1;
    const nokyoOver = a.timeMin > NOKYO_CLOSE;
    const nokyoDiff = NOKYO_CLOSE - a.timeMin; // 正=まだ余裕あり、負=超過
    let nokyoExtra = '';
    if(nokyoOver){
      nokyoExtra = ` ${t('nokyo_over', Math.abs(Math.round(nokyoDiff)))}`;
    } else if(nokyoDiff <= 30){
      nokyoExtra = ` ${t('nokyo_countdown', Math.round(nokyoDiff))}`;
    }
    const displayName = templeDisplayName(temple);

    html += `<div class="stop">
      <div class="stop-rail">
        <div class="stop-dot"></div>
        ${!isLast ? `<div class="stop-connector ${arrival[idx+1] && arrival[idx+1].mode==='bus' ? 'bus':''}"></div>` : ''}
        <div class="stop-time">${toHHMM(a.timeMin)}</div>
      </div>
      <div class="stop-card">
        <div class="stop-title"><span class="no">${String(temple.no).padStart(2,'0')}</span>${displayName}
          <button type="button" class="visited-toggle" onclick="toggleVisited(${temple.no}, this)" title="${isVisited(temple.no) ? t('visited_unmark') : t('visited_mark')}">${isVisited(temple.no) ? '★' : '☆'}</button>
          <span class="nokyo-badge ${nokyoOver?'nokyo-warn':'nokyo-ok'}">${(nokyoOver? t('nokyo_warn') : t('nokyo_ok'))}${nokyoExtra}</span>
        </div>
        <div class="stop-meta mono">${temple.kana}</div>
        ${TEMPLE_HONZON[temple.no] ? `
          <div class="honzon-toggle" onclick="this.nextElementSibling.classList.toggle('open')">${t('temple_info_toggle')}</div>
          <div class="honzon-info">${t('label_honzon')}：${honzonDisplay(temple.no)}</div>` : ''}
        ${a.note ? `
          <div class="segment-note" onclick="openMapForIndex(${idx})">
            <span class="badge-mode ${a.mode}">${a.mode==='bus'?'BUS':'WALK'}</span>
            ${a.busResult && a.busResult.transfers === 1 ? `<span class="badge-mode transfer">${t('transfer_badge')}</span>` : ''}
            <b>${t('to_temple_km', displayName, a.distanceKm)}</b>：${a.note}
            <div class="map-link">${t('map_link')}</div>
          </div>` : ''}
      </div>
    </div>`;
  });
  document.getElementById('timeline').innerHTML = html;
}

(async function init(){
  applyStaticTranslations();
  document.getElementById('timeline').innerHTML = `<div class="segment-note">${t('loading_temples')}</div>`;
  try{
    await loadTemples();
  }catch(e){
    document.getElementById('timeline').innerHTML =
      `<div class="segment-note">${t('err_temples')}</div>`;
    return;
  }
  populateTempleSelects();
  updateProgressLabel();
  // 言語切り替え時のページ再読み込みで、選択中だった出発・到着札所・日付・時刻をURLパラメータから復元
  const params = new URLSearchParams(location.search);
  const restoredFrom = params.get('from');
  const restoredTo = params.get('to');
  const restoredDate = params.get('date');
  const restoredTime = params.get('time');
  if(restoredFrom && temples.some(t=>String(t.no)===restoredFrom)) startSel.value = restoredFrom;
  if(restoredTo && temples.some(t=>String(t.no)===restoredTo)) endSel.value = restoredTo;
  if(restoredDate){
    const [ry,rm,rd] = restoredDate.split('-').map(Number);
    if(ry && rm && rd) buildDateFields(new Date(ry, rm-1, rd));
  }
  buildTimeFields(restoredTime);
  runPlanner();
})();

let lastArrival = [];
let googleMap = null;
let mapOverlays = []; // 開き直すたびにクリアするマーカー・ポリラインの一覧
let mapReqToken = 0;

// Google Maps JS APIの読み込み完了を待つための仕組み
// (実体・コールバック関数本体は head 内で定義済み。ここではグローバルの状態を参照するだけ)
function waitForGoogleMaps(){
  if(window.__googleMapsReady) return Promise.resolve();
  return new Promise(function(resolve){ window.__googleMapsReadyWaiters.push(resolve); });
}

function clearMapOverlays(){
  mapOverlays.forEach(o=> o.setMap(null));
  mapOverlays = [];
}

// Directions APIで実際の道なりルートを取得
// mode: 'WALKING'(徒歩) または 'DRIVING'(バス経路の近似。本来はGTFS shapes.txtが理想)
function fetchRoute(from, to, travelMode){
  return new Promise((resolve, reject)=>{
    const service = new google.maps.DirectionsService();
    service.route({
      origin: { lat: from.lat, lng: from.lng },
      destination: { lat: to.lat, lng: to.lng },
      travelMode: google.maps.TravelMode[travelMode],
    }, (result, status)=>{
      if(status === 'OK' && result.routes && result.routes.length){
        const coords = result.routes[0].overview_path.map(p=>[p.lat(), p.lng()]);
        resolve({ coords });
      } else {
        reject(new Error(`Directions request failed: ${status}`));
      }
    });
  });
}

// 自前サーバー経由でOverpass(OpenStreetMap)に問い合わせ、沿道の目印を取得
async function fetchLandmarks(routeCoords, retried=false){
  const lats = routeCoords.map(c=>c[0]), lngs = routeCoords.map(c=>c[1]);
  const pad = 0.004;
  const bbox = [Math.min(...lats)-pad, Math.min(...lngs)-pad, Math.max(...lats)+pad, Math.max(...lngs)+pad].join(',');

  let data;
  try{
    const res = await fetch(`${API_BASE}/overpass-proxy?bbox=${encodeURIComponent(bbox)}`);
    if(!res.ok) throw new Error(`overpass-proxy failed (status ${res.status})`);
    data = await res.json();
  }catch(e){
    if(!retried){
      await new Promise(r=>setTimeout(r, 1500));
      return fetchLandmarks(routeCoords, true);
    }
    throw e;
  }

  const candidates = (data.elements||[])
    .filter(el => el.tags)
    .map(el => ({ lat:el.lat, lng:el.lon, name: el.tags.name || landmarkLabel(el.tags), tags:el.tags }))
    .map(p => ({ ...p, dist: distToPolyline(p.lat, p.lng, routeCoords), priority: landmarkPriority(p.tags) }))
    .filter(p => p.dist <= 180)
    .sort((a,b)=> (a.priority - b.priority) || (a.dist - b.dist));

  const picked = [];
  for(const c of candidates){
    if(picked.length >= 9) break;
    if(picked.some(p => p.name===c.name && metersBetween(p.lat,p.lng,c.lat,c.lng) < 150)) continue;
    picked.push(c);
  }
  return picked;
}

// 優先順位: トイレ > 宿泊施設 > 道の駅 > 温泉 > 自動販売機 > その他既存カテゴリ
function landmarkPriority(tags){
  if(tags.amenity==='toilets') return 1;
  if(tags.tourism && /hotel|guest_house|motel|hostel|ryokan/.test(tags.tourism)) return 2;
  if(tags.name && tags.name.includes('道の駅')) return 3;
  if(tags.amenity==='public_bath' || tags.natural==='hot_spring' || (tags.name && tags.name.includes('温泉'))) return 4;
  if(tags.amenity==='vending_machine') return 5;
  return 9;
}

function landmarkLabel(tags){
  if(tags.amenity==='toilets') return t('landmark_toilet');
  if(tags.tourism && /hotel|guest_house|motel|hostel|ryokan/.test(tags.tourism)) return t('landmark_lodging');
  if(tags.name && tags.name.includes('道の駅')) return t('landmark_roadside');
  if(tags.amenity==='public_bath' || tags.natural==='hot_spring' || (tags.name && tags.name.includes('温泉'))) return t('landmark_onsen');
  if(tags.amenity==='vending_machine') return t('landmark_vending');
  if(tags.amenity==='place_of_worship') return t('landmark_temple');
  if(tags.shop) return t('landmark_shop');
  if(tags.amenity==='cafe' || tags.amenity==='restaurant') return t('landmark_dining');
  if(tags.railway==='station') return t('landmark_station');
  if(tags.highway==='bus_stop') return t('landmark_busstop');
  if(tags.historic) return t('landmark_historic');
  if(tags.tourism) return t('landmark_tourism');
  return t('landmark_other');
}

function landmarkColor(tags){
  const p = landmarkPriority(tags);
  if(p===1) return '#2E7D32'; // トイレ: 緑
  if(p===2) return '#1D2B4F'; // 宿泊: 紺
  if(p===3) return '#AD8A50'; // 道の駅: 金
  if(p===4) return '#C0472C'; // 温泉: 朱
  if(p===5) return '#5B6B4F'; // 自販機: 落ち着いた緑
  if(tags.amenity==='place_of_worship') return '#7B4B94'; // 寺社: 紫
  if(tags.shop) return '#B5651D'; // 商店: 茶
  if(tags.amenity==='cafe' || tags.amenity==='restaurant') return '#D08A2E'; // 飲食: 橙
  if(tags.railway==='station') return '#2C6E8C'; // 駅: 青
  if(tags.highway==='bus_stop') return '#8C6E2C'; // バス停: 黄土色
  if(tags.historic) return '#5C4A3D'; // 史跡: こげ茶
  if(tags.tourism) return '#3C7A6E'; // 観光: 深緑がかった青
  return '#8a8578';
}

// 全カテゴリに絵文字アイコンを割り当て、地図上で一目でジャンルが分かるようにする
function landmarkGlyph(tags){
  const p = landmarkPriority(tags);
  if(p===1) return '🚻';
  if(p===2) return '🛏️';
  if(p===3) return '🛣️';
  if(p===4) return '♨️';
  if(p===5) return '🥤';
  if(tags.amenity==='place_of_worship') return '卍'; // 地図記号でおなじみの寺院マーク
  if(tags.shop) return '🏪';
  if(tags.amenity==='cafe' || tags.amenity==='restaurant') return '🍴';
  if(tags.railway==='station') return '🚉';
  if(tags.highway==='bus_stop') return '🚏';
  if(tags.historic) return '🏯';
  if(tags.tourism) return '📷';
  return '📍';
}

function drawPolyline(coords, color, dashed){
  const path = coords.map(c=>({lat:c[0], lng:c[1]}));
  const lineSymbol = { path:'M 0,-1 0,1', strokeOpacity:1, scale:3 };
  const line = new google.maps.Polyline({
    path,
    strokeColor: color,
    strokeOpacity: dashed ? 0 : 0.9,
    strokeWeight: 4,
    icons: dashed ? [{ icon: lineSymbol, offset:'0', repeat:'10px' }] : undefined,
    map: googleMap,
  });
  mapOverlays.push(line);
  return line;
}

function addPinMarker(position, color, label, title, scale, labelFontSize){
  const marker = new google.maps.Marker({
    position, map: googleMap, title,
    label: label ? { text:label, color:'#fff', fontSize: labelFontSize || '11px', fontWeight:'700' } : undefined,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: scale || 9,
      fillColor: color,
      fillOpacity: 1,
      strokeColor: '#fff',
      strokeWeight: 2,
    },
  });
  mapOverlays.push(marker);
  return marker;
}

function addLandmarkMarker(lm){
  const color = landmarkColor(lm.tags);
  const glyph = landmarkGlyph(lm.tags);
  const marker = addPinMarker({lat:lm.lat, lng:lm.lng}, color, glyph, lm.name, 10, '12px');
  marker.addListener('click', ()=>{
    new google.maps.InfoWindow({
      content: `<div style="font-family:'Noto Sans JP',sans-serif;font-size:12px;">${lm.name}</div>`
    }).open(googleMap, marker);
  });
}

function fitBoundsToCoords(coords){
  const bounds = new google.maps.LatLngBounds();
  coords.forEach(c=> bounds.extend({lat:c[0], lng:c[1]}));
  googleMap.fitBounds(bounds, 40);
}

// 徒歩区間の標高プロファイルを取得し、獲得標高(上り)・下り標高を計算する
async function fetchElevationProfile(coords){
  const { ElevationService } = await google.maps.importLibrary('elevation');
  const elevator = new ElevationService();
  const path = coords.map(c=>({lat:c[0], lng:c[1]}));
  const samples = Math.min(60, Math.max(2, coords.length));
  const response = await elevator.getElevationAlongPath({ path, samples });
  if(!response || !response.results) throw new Error('Elevation request returned no results');
  const elevations = response.results.map(r=>r.elevation);

  // サンプルは経路全体に等間隔に取られるため、経路の総距離から各点の距離を逆算する
  let totalDist = 0;
  for(let i=1;i<coords.length;i++){
    totalDist += metersBetween(coords[i-1][0], coords[i-1][1], coords[i][0], coords[i][1]);
  }
  const distances = elevations.map((_, i)=> totalDist * i/(elevations.length-1));
  return { elevations, distances, totalDist };
}
function elevationGainLoss(elevations){
  let gain=0, loss=0;
  for(let i=1;i<elevations.length;i++){
    const diff = elevations[i]-elevations[i-1];
    if(diff>0) gain+=diff; else loss += -diff;
  }
  return { gain: Math.round(gain), loss: Math.round(loss) };
}

// 一番大きな「連続した上り」区間を探す（横ばい・微小な上りは1つの区間としてまとめる）
function findBiggestClimb(elevations, distances){
  let best = { gain:0, startIdx:0, endIdx:0 };
  let i = 0;
  while(i < elevations.length-1){
    if(elevations[i+1] > elevations[i]){
      let j = i;
      while(j < elevations.length-1 && elevations[j+1] >= elevations[j]) j++;
      const gain = elevations[j] - elevations[i];
      if(gain > best.gain) best = { gain, startIdx:i, endIdx:j };
      i = j;
    } else {
      i++;
    }
  }
  return best;
}

// 標高プロファイルをシンプルな折れ線グラフ(SVG)として描画する
function buildElevationSvg(elevations, distances){
  const w=280, h=88, padX=6, padY=6, labelH=14, padLeft=30; // padLeft: 左側に標高目盛り表示用のスペースを確保
  const chartH = h - labelH;
  const minE = Math.min(...elevations), maxE = Math.max(...elevations);
  const range = Math.max(1, maxE-minE);
  const totalDist = distances[distances.length-1] || 1;
  const chartLeft = padX + padLeft;

  const xForIdx = (i)=> chartLeft + (distances[i]/totalDist) * (w-padLeft-padX*2);
  const yForE = (e)=> (chartH-padY) - ((e-minE)/range) * (chartH-2*padY);

  const pts = elevations.map((e,i)=> `${xForIdx(i).toFixed(1)},${yForE(e).toFixed(1)}`);
  const area = `${chartLeft},${chartH-padY} ${pts.join(' ')} ${w-padX},${chartH-padY}`;

  // 標高(Y軸)の目盛り: 最低・中間・最高の3段階
  const midE = (minE+maxE)/2;
  const yTicks = [minE, midE, maxE];
  let yGrid = '', yLabels = '';
  yTicks.forEach(e=>{
    const y = yForE(e);
    yGrid += `<line x1="${chartLeft}" y1="${y.toFixed(1)}" x2="${w-padX}" y2="${y.toFixed(1)}" stroke="rgba(43,40,37,0.08)" stroke-width="1"></line>`;
    yLabels += `<text x="${(chartLeft-4).toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="8.5" fill="#8a8578" font-family="JetBrains Mono, monospace" text-anchor="end">${Math.round(e)}m</text>`;
  });

  // 距離(X軸)目盛り: 基本は1km刻み。区間が長い場合はラベルが重ならないよう間隔を自動で広げる(2/5/10/20km)
  const totalKm = totalDist/1000;
  const stepCandidates = [1,2,5,10,20,50];
  const stepKm = stepCandidates.find(s => totalKm/s <= 6) ?? 50;

  const xForKm = (km)=> chartLeft + ((km*1000)/totalDist) * (w-padLeft-padX*2);
  let xGrid = '', xLabels = '';
  for(let km=0; km<=totalKm + 0.001; km+=stepKm){
    const x = xForKm(km);
    xGrid += `<line x1="${x.toFixed(1)}" y1="${padY}" x2="${x.toFixed(1)}" y2="${chartH}" stroke="rgba(43,40,37,0.08)" stroke-width="1"></line>`;
    const anchor = km===0 ? 'start' : (km>=totalKm-0.001 ? 'end' : 'middle');
    xLabels += `<text x="${x.toFixed(1)}" y="${h-2}" font-size="9" fill="#8a8578" font-family="JetBrains Mono, monospace" text-anchor="${anchor}">${km}km</text>`;
  }
  if(totalKm - Math.floor(totalKm/stepKm)*stepKm > stepKm*0.3){
    const x = xForKm(totalKm);
    xLabels += `<text x="${x.toFixed(1)}" y="${h-2}" font-size="9" fill="#8a8578" font-family="JetBrains Mono, monospace" text-anchor="end">${totalKm.toFixed(1)}km</text>`;
  }

  // このアプリらしい演出: 最高地点に金色のマーカーと標高ラベルを表示する
  let peakMark = '';
  const peakIdx = elevations.indexOf(maxE);
  if(range > 5){ // ほぼ平坦な区間ではわざわざ強調しない
    const px = xForIdx(peakIdx), py = yForE(maxE);
    const labelAbove = py > 16; // 上端に近い場合はラベルを下に出す
    peakMark = `
      <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.2" fill="#AD8A50" stroke="#fff" stroke-width="1.2"></circle>
      <text x="${px.toFixed(1)}" y="${(labelAbove ? py-7 : py+13).toFixed(1)}" font-size="9" fill="#AD8A50" font-family="JetBrains Mono, monospace" font-weight="700" text-anchor="middle">${Math.round(maxE)}m</text>`;
  }

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;margin-top:6px;">
    <polygon points="${area}" fill="rgba(91,107,79,0.22)"></polygon>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#5B6B4F" stroke-width="1.6"></polyline>
    <line x1="${chartLeft}" y1="${chartH}" x2="${w-padX}" y2="${chartH}" stroke="rgba(43,40,37,0.15)" stroke-width="1"></line>
    ${yGrid}
    ${xGrid}
    ${yLabels}
    ${xLabels}
    ${peakMark}
  </svg>`;
}

function showCurrentLocation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const { latitude, longitude } = pos.coords;
      addPinMarker({lat:latitude, lng:longitude}, '#2F6FED', null, t('current_location'), 10);
      const bounds = googleMap.getBounds();
      if(bounds){
        bounds.extend({lat:latitude, lng:longitude});
        googleMap.fitBounds(bounds, 40);
      }
    },
    (err)=> console.warn('現在地の取得に失敗しました（権限が許可されていない可能性があります）', err),
    { enableHighAccuracy:true, timeout:8000, maximumAge:30000 }
  );
}

function openMapForIndex(idx){
  const a = lastArrival[idx];
  const prev = lastArrival[idx-1];
  if(!a || !prev) return;
  openMap(prev.no, a.no, a.mode, a.note, a.distanceKm, a.busResult);
}

async function openMap(fromNo, toNo, mode, note, distanceKm, busResult){
  const from = temples.find(t=>t.no===fromNo);
  const to = temples.find(t=>t.no===toNo);
  const myToken = ++mapReqToken;

  document.getElementById('mapTitle').textContent = `${templeDisplayName(from)} → ${templeDisplayName(to)}`;
  const noLabel = currentLang==='en' ? '#' : '番';
  document.getElementById('mapSub').textContent = `${noLabel}${String(from.no).padStart(2,'0')} → ${noLabel}${String(to.no).padStart(2,'0')}｜${distanceKm}km`;
  document.getElementById('mapFoot').innerHTML =
    `<span class="badge-mode ${mode}">${mode==='bus'?'BUS':'WALK'}</span>${note}<br><span style="color:#8a8578;">${t('loading_route')}</span>`;

  document.getElementById('mapOverlay').classList.add('open');

  await waitForGoogleMaps();
  if(myToken !== mapReqToken) return;

  setTimeout(async ()=>{
    clearMapOverlays();
    googleMap = new google.maps.Map(document.getElementById('mapCanvas'), {
      center: { lat: from.lat, lng: from.lng },
      zoom: 13,
      disableDefaultUI: true,
      zoomControl: true,
      gestureHandling: 'greedy', // 1本指パン・ピンチズーム・2本指回転を全て地図側で処理する
    });

    addPinMarker({lat:from.lat, lng:from.lng}, '#1D2B4F', String(from.no).padStart(2,'0'), templeDisplayName(from), 13);
    addPinMarker({lat:to.lat, lng:to.lng}, '#A63A2A', String(to.no).padStart(2,'0'), templeDisplayName(to), 13);

    // 直通バスで、かつ停留所座標が両方揃っている場合だけ「徒歩→バス→徒歩」の3区間で描画。
    // 乗り換えルートは現状、乗換停留所の座標をAPIが返していないため簡易表示にフォールバック。
    const useBusStops = mode==='bus' && busResult && busResult.transfers !== 1
      && busResult.from_stop_lat && busResult.to_stop_lat;

    let allCoords = [];
    let walkOnlyCoords = []; // 標高計算の対象（徒歩区間のみ。バス乗車中の区間は対象外）
    let routeOk = false, routeErr = null;

    if(useBusStops){
      const fromStop = { lat:Number(busResult.from_stop_lat), lng:Number(busResult.from_stop_lon) };
      const toStop   = { lat:Number(busResult.to_stop_lat),   lng:Number(busResult.to_stop_lon) };
      try{
        const [walk1, busLeg, walk2] = await Promise.all([
          fetchRoute(from, fromStop, 'WALKING').catch(()=>({coords:[[from.lat,from.lng],[fromStop.lat,fromStop.lng]]})),
          fetchRoute(fromStop, toStop, 'DRIVING').catch(()=>({coords:[[fromStop.lat,fromStop.lng],[toStop.lat,toStop.lng]]})),
          fetchRoute(toStop, to, 'WALKING').catch(()=>({coords:[[toStop.lat,toStop.lng],[to.lat,to.lng]]})),
        ]);
        if(myToken !== mapReqToken) return;
        drawPolyline(walk1.coords, '#5B6B4F', false);
        drawPolyline(busLeg.coords, '#A63A2A', true);
        drawPolyline(walk2.coords, '#5B6B4F', false);
        addPinMarker(fromStop, '#A63A2A', null, busResult.from_stop_name || 'バス停', 7);
        addPinMarker(toStop, '#A63A2A', null, busResult.to_stop_name || 'バス停', 7);
        allCoords = [...walk1.coords, ...busLeg.coords, ...walk2.coords];
        walkOnlyCoords = [...walk1.coords, ...walk2.coords];
        routeOk = true;
      }catch(e){
        routeErr = e.message;
        allCoords = [[from.lat,from.lng],[to.lat,to.lng]];
        drawPolyline(allCoords, '#A63A2A', true);
      }
    } else {
      try{
        const travelMode = mode==='bus' ? 'DRIVING' : 'WALKING';
        const r = await fetchRoute(from, to, travelMode);
        if(myToken !== mapReqToken) return;
        allCoords = r.coords;
        if(mode!=='bus') walkOnlyCoords = allCoords; // バス(driving)区間は標高計算の対象外
        routeOk = true;
      }catch(e){
        routeErr = e.message;
        allCoords = [[from.lat,from.lng],[to.lat,to.lng]];
      }
      drawPolyline(allCoords, mode==='bus' ? '#A63A2A' : '#5B6B4F', mode==='bus');
    }

    fitBoundsToCoords(allCoords);
    showCurrentLocation();

    let elevationNote = '';
    if(walkOnlyCoords.length >= 2){
      try{
        const { elevations, distances } = await fetchElevationProfile(walkOnlyCoords);
        if(myToken !== mapReqToken) return;
        const { gain, loss } = elevationGainLoss(elevations);
        const climb = findBiggestClimb(elevations, distances);

        let climbText = '';
        if(climb.gain >= 20){ // 20m未満の小さな起伏は「最大の上り」として案内しない
          const startKm = (distances[climb.startIdx]/1000).toFixed(1);
          const endKm = (distances[climb.endIdx]/1000).toFixed(1);
          const lengthKm = ((distances[climb.endIdx]-distances[climb.startIdx])/1000).toFixed(1);
          climbText = t('elevation_climb', startKm, endKm, lengthKm, Math.round(climb.gain));
        }
        const svg = buildElevationSvg(elevations, distances);

        elevationNote = `<br><span style="color:#5a564f;">${t('elevation_stats', gain, loss)}　${climbText}</span>${svg}`;
      }catch(e){
        console.warn('elevation fetch failed', e);
      }
    }

    let landmarksOk = false, landmarks = [], lmErr = null;
    try{
      landmarks = await fetchLandmarks(allCoords);
      if(myToken !== mapReqToken) return;
      landmarksOk = true;
      // 出発・到着の札所自体は既に大きいピンで表示済みなので、目印一覧からは除外する
      landmarks = landmarks.filter(lm =>
        metersBetween(lm.lat, lm.lng, from.lat, from.lng) > 60 &&
        metersBetween(lm.lat, lm.lng, to.lat, to.lng) > 60
      );
      landmarks.forEach(addLandmarkMarker);
    }catch(e){
      lmErr = e.message;
    }

    const routeNote = routeOk
      ? (useBusStops ? t('route_shown_bus') : t('route_shown_direct'))
      : `<span style="color:#A63A2A;">${t('route_fail', routeErr)}</span>`;
    const lmNote = landmarksOk
      ? (landmarks.length ? t('landmarks_found', landmarks.length, landmarks.map(l=>{
          const label = landmarkLabel(l.tags);
          // トイレ・自販機など固有名称が無いものは name===label になるため、括弧書きの重複を避ける
          return l.name === label ? l.name : `${l.name}(${label})`;
        }).join(currentLang==='en' ? ', ' : '、'))
                           : t('landmarks_none'))
      : `<span style="color:#A63A2A;">${t('landmarks_fail', lmErr)}</span>`;

    document.getElementById('mapFoot').innerHTML =
      `<span class="badge-mode ${mode}">${mode==='bus'?'BUS':'WALK'}</span>${note}<br>
       <span style="color:#5a564f;">${routeNote}</span>${elevationNote}<br>
       <span style="color:#5a564f;">${lmNote}</span><br>
       <span style="color:#b0aa9c;font-size:10.5px;">Landmark data: &copy; OpenStreetMap contributors (ODbL)</span>`;
  }, 60);
}

function closeMap(){
  document.getElementById('mapOverlay').classList.remove('open');
}
</script>
</body>
</html>
